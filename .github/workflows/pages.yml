name: Kernel in the browser (Pages)

on:
  push:
    branches: [ "hello-kernel", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kernels:
    # Same base image and packages as Dockerfile-build-and-run.
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      TERM: xterm
    steps:
    - name: Install toolchain
      run: |
        apt-get update
        apt-get install -y build-essential llvm clang lld nasm qemu-system-x86 expect python3 curl

    - uses: actions/checkout@v4

    - name: Build the hello kernel
      run: make -C hello LLVM=1

    - name: Boot the hello kernel in qemu (vmtest)
      run: make -C hello test

    - name: Build the minified Linux and run the make vm gate
      run: make vm

    - name: Collect kernels
      run: |
        mkdir -p out/hello out/minified-linux
        cp hello/bzImage out/hello/bzImage
        cp minified/arch/x86/boot/bzImage out/minified-linux/bzImage
        site/gen-symbols.py hello/boot/high/kernel.elf out/hello/symbols.json hello
        site/gen-symbols.py minified/vmlinux out/minified-linux/symbols.json minified-linux
        site/gen-disasm.py hello/boot/high/kernel.elf out/hello/disasm.json
        site/gen-disasm.py minified/vmlinux out/minified-linux/disasm.json
        # Inputs for the browser test's symbol import (not deployed).
        mkdir -p out/import-test
        cp minified/vmlinux out/import-test/vmlinux
        llvm-nm -n minified/vmlinux > out/import-test/System.map
        ls -l out/*/

    # Third sample kernel: Debian bookworm's linux-image-6.1.0-50-686
    # (non-PAE 686) with symbols from its -dbg package (~760 MB, cached by
    # hash). snapshot.debian.org URLs stay valid; deb.debian.org is the
    # fallback. Both checked against the SHA-256 below (also pinned in
    # site/test_distro_symbols.py).
    - uses: actions/cache@v4
      with:
        path: debian-debs
        key: debian-686-6.1.176-1-526c469c5148-4625e3cd446f

    - name: Debian 6.1 686 kernel and symbols
      run: |
        mkdir -p debian-debs
        get() { # file, snapshot path, pool path, sha256
          f="debian-debs/$1"
          if [ ! -f "$f" ] || ! echo "$4  $f" | sha256sum -c --quiet; then
            curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$2" ||
              curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$3"
          fi
          echo "$4  $f" | sha256sum -c
        }
        start=$(date +%s)
        get linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          526c469c5148a2b61c4241c3f6575427096575e0ffef9541b6729351c600b3e4
        get linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          4625e3cd446ff2ade7776492bfdecd60b2fb6a72b8b99a97e04f0e472dfeeb84
        echo "Debian downloads: $(( $(date +%s) - start )) s"
        x="$RUNNER_TEMP/deb"
        mkdir -p "$x"
        dpkg-deb --fsys-tarfile debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb |
          tar -x -C "$x" ./boot/vmlinuz-6.1.0-50-686
        dpkg-deb --fsys-tarfile debian-debs/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb |
          tar -x -C "$x" ./usr/lib/debug/boot/vmlinux-6.1.0-50-686
        d=out/debian-6.1-686
        mkdir -p "$d"
        cp "$x/boot/vmlinuz-6.1.0-50-686" "$d/bzImage"
        site/gen-symbols.py --trim "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/symbols.json" debian-6.1-686
        printf '%s\n' '{"label": "Debian 6.1 686 (no initrd: ends in a root-fs panic)", "cmdline": "nokaslr console=tty0 cryptomgr.notests", "ram": 67108864}' > "$d/meta.json"
        rm -rf "$x"
        gzip -9 -c "$d/symbols.json" | wc -c | sed 's/^/debian symbols.json gzip: /'
        echo "Debian step: $(( $(date +%s) - start )) s"
        ls -l "$d"

    # C source annotations for the site only: a -g copy of each tree. The
    # kernels that boot are untouched; the job fails if the -g build's code
    # differs from them (only the GNU build-id note, a hash over the whole
    # ELF including the debug info, may differ).
    - name: Debug-info builds and sources.json
      run: |
        g="$RUNNER_TEMP/g"
        rm -rf "$g" && mkdir -p "$g"
        cp -a minified hello "$g/"
        start=$(date +%s)
        make -C "$g/minified" clean
        make -C "$g/minified" LLVM=1 -j6 KCFLAGS=-g
        echo "minified Linux -g build: $(( $(date +%s) - start )) s"
        llvm-objcopy -O binary --remove-section=.notes minified/vmlinux "$g/plain.bin"
        llvm-objcopy -O binary --remove-section=.notes "$g/minified/vmlinux" "$g/debug.bin"
        if ! cmp "$g/plain.bin" "$g/debug.bin"; then
          echo "::error::the -g build of minified/ is not byte-identical to the kernel that boots"
          exit 1
        fi
        start=$(date +%s)
        make -C "$g/hello" clean
        make -C "$g/hello" LLVM=1 CC="clang -g"
        echo "hello -g build: $(( $(date +%s) - start )) s"
        if ! cmp hello/boot/high/kernel.bin "$g/hello/boot/high/kernel.bin"; then
          echo "::error::the -g build of hello/ is not byte-identical to the kernel that boots"
          exit 1
        fi
        echo "-g builds: code byte-identical to the booting kernels"
        site/gen-source.py "$g/minified/vmlinux" "$g/minified" out/minified-linux/disasm.json out/minified-linux/sources.json
        site/gen-source.py "$g/hello/boot/high/kernel.elf" "$g/hello" out/hello/disasm.json out/hello/sources.json
        gzip -9 -c out/minified-linux/sources.json | wc -c | sed 's/^/minified-linux sources.json gzip: /'
        ls -l out/*/

    - uses: actions/upload-artifact@v4
      with:
        name: kernels
        path: out/

  site:
    needs: kernels
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: kernels
        path: site/kernels

    - name: Assemble the site
      run: |
        site/check-ids.py
        # Which commit is deployed: shown in the page header.
        python3 -c 'import json, os, subprocess
        g = lambda f: subprocess.run(["git", "log", "-1", "--format=" + f], capture_output=True, text=True).stdout.strip()
        json.dump({"sha": os.environ["GITHUB_SHA"], "date": g("%cI"), "subject": g("%s"),
                   "run_id": os.environ["GITHUB_RUN_ID"], "run_number": os.environ["GITHUB_RUN_NUMBER"],
                   "repo": os.environ["GITHUB_REPOSITORY"]}, open("site/version.json", "w"))'
        cat site/version.json
        site/gen-kernels.sh
        site/fetch-v86.sh
        # Cache busting: Pages serves with max-age=600, and a browser that
        # keeps an older app.js next to a newer index.html breaks.
        v=$(echo "$GITHUB_SHA" | cut -c1-12)
        sed -i -E "s/(href|src)=\"(style\.css|clock\.js|app\.js|stepper\.js|graph\.js|source\.js|symimport\.js|v86\/libv86\.js)\"/\1=\"\2?v=$v\"/g" site/index.html
        grep -E "\?v=$v" site/index.html

    - name: Install Playwright and Chromium
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium

    - name: Browser test (both kernels, counters, debugger, tabs, snapshots, touch, stale cache)
      run: '"$RUNNER_TEMP/venv/bin/python" site/test_browser.py'

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-screenshots
        path: site/test-screenshots/

    - name: Drop test output from the site
      run: rm -rf site/test-screenshots site/__pycache__ site/kernels/import-test

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
