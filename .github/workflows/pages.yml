name: Kernel in the browser (Pages)

on:
  push:
    branches: [ "hello-kernel", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kernels:
    # Same base image and packages as Dockerfile-build-and-run.
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      TERM: xterm
    steps:
    - name: Install toolchain
      run: |
        apt-get update
        apt-get install -y build-essential llvm clang lld nasm qemu-system-x86 expect python3 curl nodejs gdb

    - uses: actions/checkout@v4

    # The page's hello is built with -O0 (hello/Makefile's OPT; the
    # Makefile's default is -Os) so the debugger has a location for every
    # parameter and local; the -Os build is the page's "hello-os" entry.
    - name: Build the hello kernel (-O0, and -Os in a copy)
      run: |
        cp -a hello "$RUNNER_TEMP/hello-os"
        make -C hello LLVM=1 OPT=-O0
        make -C "$RUNNER_TEMP/hello-os" LLVM=1
        ls -l hello/bzImage "$RUNNER_TEMP/hello-os/bzImage"

    # The boots below read qemu's curses screen (site/qemu_screen_check.py):
    # an expect pattern on the raw output timed out in run 42539920959 when
    # curses drew "H" and "ello, World!" with escapes in between.
    - name: Test the boot screen check on a captured split output
      run: site/test_qemu_screen_check.py

    - name: Boot the hello kernels in qemu (screen check)
      run: |
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel=hello/bzImage --mem=18M --expect="Hello, World!" --expect="Still alive"
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel=hello/bzImage.low --mem=1M --expect="Hello, World!" --expect="Still alive"
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel="$RUNNER_TEMP/hello-os/bzImage" --mem=18M --expect="Hello, World!" --expect="Still alive"
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel="$RUNNER_TEMP/hello-os/bzImage.low" --mem=1M --expect="Hello, World!" --expect="Still alive"

    - name: Build the minified Linux and run the make vm gate
      run: make vm

    # The page's minified Linux is built with -O0 from the same sources so
    # the debugger has a location for every parameter and local: a copy of
    # minified/ with site/unoptimized.patch (two things -O0 needs that the
    # -Os build gets from the optimizer) and KCFLAGS=-O0. The product build
    # above (-Os, make vm) is the page's "minified-linux-os" entry.
    - name: Build the minified Linux with -O0 for the site and boot it in qemu (screen check)
      run: |
        o="$RUNNER_TEMP/o0"
        rm -rf "$o" && mkdir -p "$o"
        cp -a minified "$o/minified"
        make -C "$o/minified" clean
        patch -d "$o" -p1 < site/unoptimized.patch
        start=$(date +%s)
        make -C "$o/minified" LLVM=1 -j6 KCFLAGS=-O0
        echo "minified Linux -O0 build: $(( $(date +%s) - start )) s"
        site/qemu_screen_check.py --qemu=qemu-system-x86_64 --kernel="$o/minified/arch/x86/boot/bzImage" --mem=18M --expect="Hello, World!" --expect="Still alive"
        ls -l "$o/minified/vmlinux" "$o/minified/arch/x86/boot/bzImage" minified/arch/x86/boot/bzImage

    - name: Collect kernels
      run: |
        o="$RUNNER_TEMP/o0"
        mkdir -p out/hello out/hello-os out/minified-linux out/minified-linux-os
        cp hello/bzImage out/hello/bzImage
        cp "$RUNNER_TEMP/hello-os/bzImage" out/hello-os/bzImage
        printf '%s\n' '{"label": "hello (-O0: every variable has a location)"}' > out/hello/meta.json
        printf '%s\n' '{"label": "hello, -Os (hello/Makefile default; variables optimized out)"}' > out/hello-os/meta.json
        cp "$o/minified/arch/x86/boot/bzImage" out/minified-linux/bzImage
        cp minified/arch/x86/boot/bzImage out/minified-linux-os/bzImage
        printf '%s\n' '{"label": "minified Linux (-O0: every variable has a location)"}' > out/minified-linux/meta.json
        printf '%s\n' '{"label": "minified Linux, -Os (product build; optimized out)"}' > out/minified-linux-os/meta.json
        site/gen-symbols.py hello/boot/high/kernel.elf out/hello/symbols.json hello
        site/gen-symbols.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" out/hello-os/symbols.json hello-os
        site/gen-symbols.py "$o/minified/vmlinux" out/minified-linux/symbols.json minified-linux
        site/gen-symbols.py minified/vmlinux out/minified-linux-os/symbols.json minified-linux-os
        site/gen-disasm.py hello/boot/high/kernel.elf out/hello/disasm.json
        site/gen-disasm.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" out/hello-os/disasm.json
        site/gen-disasm.py "$o/minified/vmlinux" out/minified-linux/disasm.json
        site/gen-disasm.py minified/vmlinux out/minified-linux-os/disasm.json
        # The page's static jump paths (jumps.js over disasm.json) against the ELF's bytes.
        site/test_jumps.py hello/boot/high/kernel.elf out/hello/disasm.json out/hello/symbols.json
        site/test_jumps.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" out/hello-os/disasm.json out/hello-os/symbols.json
        site/test_jumps.py "$o/minified/vmlinux" out/minified-linux/disasm.json out/minified-linux/symbols.json
        site/test_jumps.py minified/vmlinux out/minified-linux-os/disasm.json out/minified-linux-os/symbols.json
        # Inputs for the browser test's symbol import into the page's
        # minified-linux (not deployed).
        mkdir -p out/import-test
        cp "$o/minified/vmlinux" out/import-test/vmlinux
        llvm-nm -n "$o/minified/vmlinux" > out/import-test/System.map
        ls -l out/*/

    # Third sample kernel: Debian bookworm's linux-image-6.1.0-50-686
    # (non-PAE 686) with symbols from its -dbg package (~760 MB, cached by
    # hash). snapshot.debian.org URLs stay valid; deb.debian.org is the
    # fallback. Both checked against the SHA-256 below (also pinned in
    # site/test_distro_symbols.py).
    - uses: actions/cache@v4
      with:
        path: debian-debs
        key: debian-686-6.1.176-1-526c469c5148-4625e3cd446f

    # Its source package (upstream tarball + Debian's patches) for the C
    # source view, also pinned (the SHA-256 of linux_6.1.176-1.dsc).
    - uses: actions/cache@v4
      with:
        path: debian-src
        key: debian-src-6.1.176-1-9aad4025973f-10477b04dc15

    - name: Debian 6.1 686 kernel and symbols
      run: |
        mkdir -p debian-debs debian-src
        get() { # file, snapshot path, pool path, sha256
          f=$1
          if [ ! -f "$f" ] || ! echo "$4  $f" | sha256sum -c --quiet; then
            curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$2" ||
              curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$3"
          fi
          echo "$4  $f" | sha256sum -c
        }
        start=$(date +%s)
        get debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          526c469c5148a2b61c4241c3f6575427096575e0ffef9541b6729351c600b3e4
        get debian-debs/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          4625e3cd446ff2ade7776492bfdecd60b2fb6a72b8b99a97e04f0e472dfeeb84
        get debian-src/linux_6.1.176.orig.tar.xz pool/main/l/linux/linux_6.1.176.orig.tar.xz \
          pool/main/l/linux/linux_6.1.176.orig.tar.xz 9aad4025973feea3f0d978e82ab7db97d8d5ce3f59fcc6b1f316153d66e3a504
        get debian-src/linux_6.1.176-1.debian.tar.xz pool/main/l/linux/linux_6.1.176-1.debian.tar.xz \
          pool/main/l/linux/linux_6.1.176-1.debian.tar.xz 10477b04dc15f7c1c52d8c812c889be5fd37aa178163e352755cd137c73ade6b
        echo "Debian downloads: $(( $(date +%s) - start )) s"
        x="$RUNNER_TEMP/deb"
        mkdir -p "$x"
        dpkg-deb --fsys-tarfile debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb |
          tar -x -C "$x" ./boot/vmlinuz-6.1.0-50-686
        dpkg-deb --fsys-tarfile debian-debs/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb |
          tar -x -C "$x" ./usr/lib/debug/boot/vmlinux-6.1.0-50-686
        d=out/debian-6.1-686
        mkdir -p "$d"
        cp "$x/boot/vmlinuz-6.1.0-50-686" "$d/bzImage"
        site/gen-symbols.py --trim "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/symbols.json" debian-6.1-686
        site/gen-dwarf.js "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/dwarf"
        site/test_dwarf.py "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/dwarf" --samples 5000 --types 2000 --cfi 5000 --locals 2000 --operands 2000 --lines 2000 --funcs 1000 --vars 2000 \
          --strip debian/build/build_i386_none_686/ --strip /build/reproducible-path/linux-6.1.176/
        cat "$d"/dwarf/[0-9a-f]*.bin | gzip -9 | wc -c | sed 's/^/debian dwarf shards gzip: /'
        cat "$d"/dwarf/cfi-*.bin | gzip -9 | wc -c | sed 's/^/debian cfi shards gzip: /'
        gzip -9 -c "$d/dwarf/types.json" | wc -c | sed 's/^/debian types.json gzip: /'
        gzip -9 -c "$d/dwarf/files.json" | wc -c | sed 's/^/debian files.json gzip: /'
        cat "$d"/dwarf/locals-*.json.gz | wc -c | sed 's/^/debian locals shards (gzipped files): /'
        cat "$d"/dwarf/funcs-*.json.gz | wc -c | sed 's/^/debian function facts shards (gzipped files): /'
        site/gen-debian-source.sh debian-src/linux_6.1.176.orig.tar.xz debian-src/linux_6.1.176-1.debian.tar.xz "$x/src"
        site/gen-src.js "$d/dwarf" "$x/src" "$d/src" \
          --origin "Debian's source package linux 6.1.176-1 (linux_6.1.176.orig.tar.xz with the patches of debian/patches/series from linux_6.1.176-1.debian.tar.xz)" \
          --note "arch/x86/include/generated/asm/syscalls_32.h=made by the build: regenerated with scripts/syscalltbl.sh --abis i386 from arch/x86/entry/syscalls/syscall_32.tbl" \
          --note "security/selinux/flask.h=made by the build: regenerated with scripts/selinux/genheaders"
        printf '%s\n' '{"label": "Debian 6.1 686 (no initrd: ends in a root-fs panic)", "cmdline": "nokaslr console=tty0 cryptomgr.notests", "ram": 67108864}' > "$d/meta.json"
        rm -rf "$x"
        gzip -9 -c "$d/symbols.json" | wc -c | sed 's/^/debian symbols.json gzip: /'
        echo "Debian step: $(( $(date +%s) - start )) s"
        ls -l "$d"

    # Debug data for the site only: a -g copy of each tree. The kernels that
    # boot are untouched; check-code-identity.py fails the job unless the -g
    # build's code and bzImage equal them (only the GNU build-id note, a hash
    # over the whole ELF including the debug info, may differ).
    - name: Debug-info builds, DWARF shards and C source
      run: |
        g="$RUNNER_TEMP/g"
        o="$RUNNER_TEMP/o0"
        rm -rf "$g" && mkdir -p "$g"
        cp -a hello "$g/"
        cp -a "$o/minified" "$g/minified"
        cp -a minified "$g/minified-os"
        cp -a "$RUNNER_TEMP/hello-os" "$g/hello-os"
        start=$(date +%s)
        make -C "$g/minified" clean
        make -C "$g/minified" LLVM=1 -j6 KCFLAGS="-g -O0"
        make -C "$g/minified-os" clean
        make -C "$g/minified-os" LLVM=1 -j6 KCFLAGS=-g
        echo "minified Linux -g builds: $(( $(date +%s) - start )) s"
        site/check-code-identity.py "$o/minified/vmlinux" "$o/minified/arch/x86/boot/bzImage" \
          "$g/minified/vmlinux" "$g/minified/arch/x86/boot/bzImage" --self-test
        site/check-code-identity.py minified/vmlinux minified/arch/x86/boot/bzImage \
          "$g/minified-os/vmlinux" "$g/minified-os/arch/x86/boot/bzImage" --self-test
        start=$(date +%s)
        make -C "$g/hello" clean
        make -C "$g/hello" LLVM=1 OPT=-O0 CC="clang -g"
        make -C "$g/hello-os" clean
        make -C "$g/hello-os" LLVM=1 CC="clang -g"
        echo "hello -g builds: $(( $(date +%s) - start )) s"
        site/check-code-identity.py hello/boot/high/kernel.elf hello/bzImage \
          "$g/hello/boot/high/kernel.elf" "$g/hello/bzImage" --self-test
        site/check-code-identity.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" "$RUNNER_TEMP/hello-os/bzImage" \
          "$g/hello-os/boot/high/kernel.elf" "$g/hello-os/bzImage" --self-test
        site/gen-dwarf.js "$g/minified/vmlinux" out/minified-linux/dwarf
        site/gen-dwarf.js "$g/minified-os/vmlinux" out/minified-linux-os/dwarf
        site/gen-dwarf.js "$g/hello/boot/high/kernel.elf" out/hello/dwarf
        site/gen-dwarf.js "$g/hello-os/boot/high/kernel.elf" out/hello-os/dwarf
        site/gen-src.js out/minified-linux/dwarf "$g/minified" out/minified-linux/src --origin "the minified/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12) with site/unoptimized.patch (built with -O0)"
        site/gen-src.js out/minified-linux-os/dwarf "$g/minified-os" out/minified-linux-os/src --origin "the minified/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12)"
        site/gen-src.js out/hello/dwarf "$g/hello" out/hello/src --origin "the hello/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12)"
        site/gen-src.js out/hello-os/dwarf "$g/hello-os" out/hello-os/src --origin "the hello/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12)"
        site/test_dwarf.py "$g/minified/vmlinux" out/minified-linux/dwarf --samples 5000 --types 2000 --cfi 5000 --locals 3000 --operands 2000 --lines 3000 --funcs 2000 --vars 2000 --strip "$(realpath "$g/minified")/"
        site/test_dwarf.py "$g/minified-os/vmlinux" out/minified-linux-os/dwarf --samples 5000 --types 2000 --cfi 5000 --locals 3000 --operands 2000 --lines 3000 --funcs 2000 --vars 2000 --strip "$(realpath "$g/minified-os")/"
        site/test_dwarf.py "$g/hello/boot/high/kernel.elf" out/hello/dwarf --samples 500 --types 200 --cfi 200 --locals 200 --operands 200 --lines 200 --funcs 200 --vars 200 --strip "$(realpath "$g/hello")/"
        site/test_dwarf.py "$g/hello-os/boot/high/kernel.elf" out/hello-os/dwarf --samples 500 --types 200 --cfi 200 --locals 200 --operands 200 --lines 200 --funcs 200 --vars 200 --strip "$(realpath "$g/hello-os")/"
        site/test_dwarf.py --eh-frame 2000
        site/test_dwarf.py --inline-blocks
        # The -g ELFs for the browser test's llvm-symbolizer checks (not deployed).
        mkdir -p debug-elfs
        cp "$g/minified/vmlinux" debug-elfs/minified-linux.elf
        cp "$g/minified-os/vmlinux" debug-elfs/minified-linux-os.elf
        cp "$g/hello/boot/high/kernel.elf" debug-elfs/hello.elf
        cp "$g/hello-os/boot/high/kernel.elf" debug-elfs/hello-os.elf
        ls -l out/*/

    - uses: actions/upload-artifact@v4
      with:
        name: kernels
        path: out/

    - uses: actions/upload-artifact@v4
      with:
        name: debug-elfs
        path: debug-elfs/

  # Debian's initramfs for the Debian 6.1 686 sample, built by Debian's
  # own initramfs-tools (mkinitramfs) in an i386 bookworm container from
  # the same pinned kernel package and snapshot date; cached by the
  # script's hash and the package hash.
  debian-initrd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      id: cache
      with:
        path: initrd-out
        key: debian-initrd-${{ hashFiles('site/gen-debian-initrd.sh') }}-526c469c5148

    - name: Debian 6.1 686 initramfs
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p debian-debs initrd-out
        f=debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb
        p=pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb
        curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$p" ||
          curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$p"
        echo "526c469c5148a2b61c4241c3f6575427096575e0ffef9541b6729351c600b3e4  $f" | sha256sum -c
        start=$(date +%s)
        docker run --rm --platform linux/386 -v "$PWD:/w" -w /w debian:bookworm-slim \
          sh site/gen-debian-initrd.sh "$f" initrd-out/initrd.img
        echo "initramfs build: $(( $(date +%s) - start )) s"

    - run: ls -l initrd-out

    - uses: actions/upload-artifact@v4
      with:
        name: debian-initrd
        path: initrd-out/

  # The page's v86.wasm: v86's source at the pinned commit with
  # site/v86-det.patch, built in the pinned Docker image (gen-v86.sh, R4);
  # the script fails unless the build has the recorded SHA-256.
  v86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The last build of this script and patch: used only when the build
    # cannot run (snapshot.ubuntu.com or another download down), and
    # checked against the recorded SHA-256 then.
    - uses: actions/cache/restore@v4
      id: v86cache
      with:
        path: v86-cache
        key: v86-wasm-${{ hashFiles('site/gen-v86.sh', 'site/v86-det.patch') }}

    # The runner's resolver stopped answering for *.ubuntu.com inside
    # docker builds (runs 43047910102 to 43058718914: "Could not resolve
    # 'archive.ubuntu.com'", one of canonical.com's name servers down) while
    # public resolvers answered: the builds use those.
    - name: Docker DNS
      run: |
        cfg=/etc/docker/daemon.json
        { sudo cat "$cfg" 2>/dev/null || echo '{}'; } | jq '. + {dns: ["1.1.1.1", "8.8.8.8", "9.9.9.9"]}' > "$RUNNER_TEMP/daemon.json"
        sudo cp "$RUNNER_TEMP/daemon.json" "$cfg"
        cat "$cfg"
        sudo systemctl restart docker
        docker run --rm ubuntu:24.04 getent hosts archive.ubuntu.com snapshot.ubuntu.com || true

    - name: Build v86.wasm
      id: build
      run: |
        start=$(date +%s)
        if site/gen-v86.sh; then
          echo "v86.wasm build: $(( $(date +%s) - start )) s"
          mkdir -p v86-cache && cp site/v86/v86.wasm v86-cache/
          echo built=1 >> "$GITHUB_OUTPUT"
        elif [ -f v86-cache/v86.wasm ]; then
          echo "::warning::gen-v86.sh could not build v86.wasm; using the cached build of the same script and patch"
          mkdir -p site/v86 && cp v86-cache/v86.wasm site/v86/
          site/gen-v86.sh --check
        else
          exit 1
        fi
        ls -l site/v86/v86.wasm

    - uses: actions/cache/save@v4
      if: steps.build.outputs.built == '1' && steps.v86cache.outputs.cache-hit != 'true'
      with:
        path: v86-cache
        key: v86-wasm-${{ hashFiles('site/gen-v86.sh', 'site/v86-det.patch') }}

    - uses: actions/upload-artifact@v4
      with:
        name: v86-wasm
        path: site/v86/v86.wasm

  site:
    needs: [kernels, debian-initrd, v86]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: v86-wasm
        path: site/v86

    - uses: actions/download-artifact@v4
      with:
        name: kernels
        path: site/kernels

    # A variant of the Debian sample: same bzImage and symbols, with its
    # initramfs; "break" stops Debian's init at the (initramfs) shell.
    - uses: actions/download-artifact@v4
      with:
        name: debian-initrd
        path: site/kernels/debian-6.1-686-initrd

    - name: Debian 6.1 686 with its initramfs
      run: |
        d=site/kernels/debian-6.1-686-initrd
        echo debian-6.1-686 > "$d/base"
        printf '%s\n' '{"label": "Debian 6.1 686 with its initramfs (BusyBox shell)", "cmdline": "nokaslr console=tty0 cryptomgr.notests break", "ram": 134217728}' > "$d/meta.json"
        ls -l "$d"

    - name: Assemble the site
      run: |
        site/check-ids.py
        site/check-text.py
        site/check-legend.py
        # The vendored LZ4 module (snapshots) is the pinned upstream file.
        site/gen-lz4.py --check
        # Which commit is deployed: shown in the page header.
        python3 -c 'import json, os, subprocess
        g = lambda f: subprocess.run(["git", "log", "-1", "--format=" + f], capture_output=True, text=True).stdout.strip()
        json.dump({"sha": os.environ["GITHUB_SHA"], "date": g("%cI"), "subject": g("%s"),
                   "run_id": os.environ["GITHUB_RUN_ID"], "run_number": os.environ["GITHUB_RUN_NUMBER"],
                   "repo": os.environ["GITHUB_REPOSITORY"]}, open("site/version.json", "w"))'
        cat site/version.json
        site/gen-kernels.sh
        # Every kernel has the data files of every debug feature.
        site/test_kernel_data.py
        site/fetch-v86.sh
        # The v86 job's build, checked again here.
        site/gen-v86.sh --check
        # Cache busting: Pages serves with max-age=600, and a browser that
        # keeps an older app.js next to a newer index.html breaks. stamp.py
        # puts ?v=<commit> on every script and stylesheet of index.html and
        # the commit into sw.js (a new service worker and caches per deploy).
        site/stamp.py site "$GITHUB_SHA"
        # The web app: every file sw.js precaches is in the site, the
        # manifest and its icons are valid under the Pages subpath.
        site/check-pwa.py site --subpath "/$(basename "$GITHUB_REPOSITORY")/"

    # The browser test runs in its own job (browser-test below) so the
    # deploy does not wait ~11 minutes for it; a failing test still fails
    # the workflow run.
    - uses: actions/upload-artifact@v4
      with:
        name: site
        path: site/

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

  # Install the page as a web app in Chromium with a window (Xvfb):
  # beforeinstallprompt fires, PWA.install, PWA.launch opens it standalone
  # and hello boots there. Locally deployed copy plus four broken copies
  # that must fail; then the live site once it is deployed. Headless
  # Chromium never offers to install (site/test_pwa_install.py).
  pwa-install:
    needs: [site, deploy]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-v1

    - name: Install Playwright, Chromium and Xvfb
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright pillow
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium
        sudo apt-get install -y xvfb

    - name: Install the local copy, the broken copies must fail
      env:
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: xvfb-run -a -s "-screen 0 1400x1000x24" "$RUNNER_TEMP/venv/bin/python" site/test_pwa_install.py

    # page_url is http:// for a custom domain; installing needs https.
    - name: Install the live site
      env:
        PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: xvfb-run -a -s "-screen 0 1400x1000x24" "$RUNNER_TEMP/venv/bin/python" site/test_pwa_install.py --base "https://${PAGE_URL#*://}"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pwa-install-screenshots
        path: site/test-screenshots/

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-raw-pwa
        path: jscov-raw/

  # The browser test's suites in parallel jobs (test_browser.py --suites),
  # grouped so each job takes about the same time.
  browser-test:
    needs: site
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suites:
        - boot,symbols,debugger,misc,touch,tasks_minified,hello,firstlook
        - debian,dwarf,dwarf_import,runto,initramfs,coverage,navhist,tipmarks,legend,tabs,pwa
        - tasks,operands,runto_phone,srclinks,unoptimized,jumps
        - types,covtree,unwind,lineaddr,fnfacts,branches,nopath
        - runstate
        - speedline
        - speedasm,runbadge,memeip,graphopen,srcfiles
        - snapdiff,bookmarks,deltasnap
        - jitdet,guestin,replay
        - jitsnap
        - jitrev
        - reverse
        - exactstop
        - followeip
        - followfuzz
    name: browser-test (${{ matrix.suites }})
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-v1

    # -g ELFs for the DWARF checks (llvm-symbolizer, gdb): the minified Linux's and hello's from
    # the kernels job, Debian's -dbg vmlinux from the cached package.
    - uses: actions/download-artifact@v4
      with:
        name: debug-elfs
        path: debug-elfs

    # Its own cache: the kernels job's is written from a container (other
    # compression, so another cache version on this runner).
    - uses: actions/cache@v4
      with:
        path: debian-dbg
        key: browser-debian-686-dbg-6.1.176-1-4625e3cd446f

    - name: Debian vmlinux and llvm-symbolizer
      run: |
        f=debian-dbg/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb
        p=pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb
        sum=4625e3cd446ff2ade7776492bfdecd60b2fb6a72b8b99a97e04f0e472dfeeb84
        mkdir -p debian-dbg
        if ! echo "$sum  $f" | sha256sum -c --quiet; then
          curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$p" ||
            curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$p"
        fi
        echo "$sum  $f" | sha256sum -c
        dpkg-deb --fsys-tarfile "$f" | tar -x -O ./usr/lib/debug/boot/vmlinux-6.1.0-50-686 > debug-elfs/debian-6.1-686.elf
        sudo apt-get update
        # lz4: snapdiff checks the downloaded snapshot with `lz4 -d`.
        sudo apt-get install -y llvm gdb lz4
        ls -l debug-elfs

    - name: Install Playwright and Chromium
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium

    - name: Browser test (${{ matrix.suites }})
      env:
        MKB_DEBUG_ELF_DIR: ${{ github.workspace }}/debug-elfs
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: '"$RUNNER_TEMP/venv/bin/python" site/test_browser.py --suites "${{ matrix.suites }}"'

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-screenshots-${{ strategy.job-index }}
        path: site/test-screenshots/

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-raw-${{ strategy.job-index }}
        path: jscov-raw/

  # e2e coverage of the site's JavaScript (site/jscov.py in every browser
  # job above and in pwa-install): merged, reported, and held to the
  # committed floor site/jscov-baseline.json. Runs when a test job failed too.
  jscov:
    needs: [browser-test, pwa-install]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: jscov-raw-*
        path: jscov-raw

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-v1

    # monocart-coverage-reports and its dependencies at the versions and
    # SHA-512 integrity hashes of site/jscov/package-lock.json.
    - name: Install the report tool, Playwright and Chromium
      run: |
        npm ci --prefix site/jscov --ignore-scripts --no-audit --no-fund
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium

    - name: Self-test (an unexecuted function shows as uncovered)
      run: '"$RUNNER_TEMP/venv/bin/python" site/test_jscov.py'

    # The tests ran the deployed files: sw.js and index.html stamped with
    # the commit (the site job), so the same stamp here.
    - name: Merge and report, check the baseline
      run: |
        site/stamp.py site "$GITHUB_SHA"
        node site/jscov/report.js --src site --out jscov-report --baseline site/jscov-baseline.json --summary "$GITHUB_STEP_SUMMARY" jscov-raw

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-report
        path: jscov-report/
