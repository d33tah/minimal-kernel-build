name: Kernel in the browser (Pages)

on:
  push:
    branches: [ "hello-kernel", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kernels:
    # Same base image as Dockerfile-build-and-run. The compiler and linker
    # are the native clang/lld 22.1.0 of gen-clang-native.sh (clang.wasm's
    # source, so the page's compiler makes the same objects); Debian's llvm
    # package only adds llvm-dwarfdump and llvm-symbolizer for the checks.
    needs: [clang-native, clang-wasm]
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      TERM: xterm
    steps:
    - name: Install toolchain
      run: |
        apt-get update
        apt-get install -y build-essential llvm nasm qemu-system-x86 expect python3 curl nodejs gdb

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: clang-native
        path: site/clang-native

    - uses: actions/download-artifact@v4
      with:
        name: clang-wasm
        path: site/clang

    - name: Native clang 22.1.0 first in PATH
      run: |
        site/gen-clang-native.sh --check
        site/gen-clang-wasm.sh --check
        mkdir -p /opt/clang-22 && tar -C /opt/clang-22 -xf site/clang-native/clang-native.tar
        echo /opt/clang-22/bin >> "$GITHUB_PATH"
        export PATH=/opt/clang-22/bin:$PATH
        for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          test "$(command -v $t)" = /opt/clang-22/bin/$t
        done
        clang --version
        ld.lld --version

    # The page's hello is built with -O0 (hello/Makefile's OPT; the
    # Makefile's default is -Os) so the debugger has a location for every
    # parameter and local; the -Os build is the page's "hello-os" entry.
    - name: Build the hello kernel (-O0, and -Os in a copy)
      run: |
        cp -a hello "$RUNNER_TEMP/hello-os"
        make -C hello LLVM=1 OPT=-O0
        make -C "$RUNNER_TEMP/hello-os" LLVM=1
        ls -l hello/bzImage "$RUNNER_TEMP/hello-os/bzImage"

    # The boots below read qemu's curses screen (site/qemu_screen_check.py):
    # an expect pattern on the raw output timed out in run 42539920959 when
    # curses drew "H" and "ello, World!" with escapes in between.
    - name: Test the boot screen check on a captured split output
      run: site/test_qemu_screen_check.py

    - name: Boot the hello kernels in qemu (screen check)
      run: |
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel=hello/bzImage --mem=18M --expect="Hello, World!" --expect="Still alive"
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel=hello/bzImage.low --mem=1M --expect="Hello, World!" --expect="Still alive"
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel="$RUNNER_TEMP/hello-os/bzImage" --mem=18M --expect="Hello, World!" --expect="Still alive"
        site/qemu_screen_check.py --qemu=qemu-system-i386 --kernel="$RUNNER_TEMP/hello-os/bzImage.low" --mem=1M --expect="Hello, World!" --expect="Still alive"

    - name: Build the minified Linux and run the make vm gate
      run: make vm

    # The page's minified Linux is built with -O0 from the same sources so
    # the debugger has a location for every parameter and local: a copy of
    # minified/ with site/unoptimized.patch (two things -O0 needs that the
    # -Os build gets from the optimizer) and KCFLAGS=-O0. The product build
    # above (-Os, make vm) is the page's "minified-linux-os" entry.
    - name: Build the minified Linux with -O0 for the site and boot it in qemu (screen check)
      run: |
        o="$RUNNER_TEMP/o0"
        rm -rf "$o" && mkdir -p "$o"
        cp -a minified "$o/minified"
        make -C "$o/minified" clean
        patch -d "$o" -p1 < site/unoptimized.patch
        start=$(date +%s)
        make -C "$o/minified" LLVM=1 -j6 KCFLAGS=-O0
        echo "minified Linux -O0 build: $(( $(date +%s) - start )) s"
        site/qemu_screen_check.py --qemu=qemu-system-x86_64 --kernel="$o/minified/arch/x86/boot/bzImage" --mem=18M --expect="Hello, World!" --expect="Still alive"
        ls -l "$o/minified/vmlinux" "$o/minified/arch/x86/boot/bzImage" minified/arch/x86/boot/bzImage

    - name: Collect kernels
      run: |
        o="$RUNNER_TEMP/o0"
        mkdir -p out/hello out/hello-os out/minified-linux out/minified-linux-os
        cp hello/bzImage out/hello/bzImage
        cp "$RUNNER_TEMP/hello-os/bzImage" out/hello-os/bzImage
        printf '%s\n' '{"label": "hello (-O0: every variable has a location)"}' > out/hello/meta.json
        printf '%s\n' '{"label": "hello, -Os (hello/Makefile default; variables optimized out)"}' > out/hello-os/meta.json
        cp "$o/minified/arch/x86/boot/bzImage" out/minified-linux/bzImage
        cp minified/arch/x86/boot/bzImage out/minified-linux-os/bzImage
        printf '%s\n' '{"label": "minified Linux (-O0: every variable has a location)"}' > out/minified-linux/meta.json
        printf '%s\n' '{"label": "minified Linux, -Os (product build; optimized out)"}' > out/minified-linux-os/meta.json
        site/gen-symbols.py hello/boot/high/kernel.elf out/hello/symbols.json hello
        site/gen-symbols.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" out/hello-os/symbols.json hello-os
        site/gen-symbols.py "$o/minified/vmlinux" out/minified-linux/symbols.json minified-linux
        site/gen-symbols.py minified/vmlinux out/minified-linux-os/symbols.json minified-linux-os
        site/gen-disasm.py hello/boot/high/kernel.elf out/hello/disasm.json
        site/gen-disasm.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" out/hello-os/disasm.json
        site/gen-disasm.py "$o/minified/vmlinux" out/minified-linux/disasm.json
        site/gen-disasm.py minified/vmlinux out/minified-linux-os/disasm.json
        # The page's static jump paths (jumps.js over disasm.json) against the ELF's bytes.
        site/test_jumps.py hello/boot/high/kernel.elf out/hello/disasm.json out/hello/symbols.json
        site/test_jumps.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" out/hello-os/disasm.json out/hello-os/symbols.json
        site/test_jumps.py "$o/minified/vmlinux" out/minified-linux/disasm.json out/minified-linux/symbols.json
        site/test_jumps.py minified/vmlinux out/minified-linux-os/disasm.json out/minified-linux-os/symbols.json
        # Inputs for the browser test's symbol import into the page's
        # minified-linux (not deployed).
        mkdir -p out/import-test
        cp "$o/minified/vmlinux" out/import-test/vmlinux
        llvm-nm -n "$o/minified/vmlinux" > out/import-test/System.map
        # The ELFs gen-symbols.py and gen-disasm.py read, for the page's
        # generators (gen-worker job; not deployed).
        mkdir -p gen-elfs
        cp hello/boot/high/kernel.elf gen-elfs/hello.plain.elf
        cp "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" gen-elfs/hello-os.plain.elf
        cp "$o/minified/vmlinux" gen-elfs/minified-linux.plain.elf
        cp minified/vmlinux gen-elfs/minified-linux-os.plain.elf
        ls -l out/*/

    # Third sample kernel: Debian bookworm's linux-image-6.1.0-50-686
    # (non-PAE 686) with symbols from its -dbg package (~760 MB, cached by
    # hash). snapshot.debian.org URLs stay valid; deb.debian.org is the
    # fallback. Both checked against the SHA-256 below (also pinned in
    # site/test_distro_symbols.py).
    - uses: actions/cache@v4
      with:
        path: debian-debs
        key: debian-686-6.1.176-1-526c469c5148-4625e3cd446f

    # Its source package (upstream tarball + Debian's patches) for the C
    # source view, also pinned (the SHA-256 of linux_6.1.176-1.dsc).
    - uses: actions/cache@v4
      with:
        path: debian-src
        key: debian-src-6.1.176-1-9aad4025973f-10477b04dc15

    - name: Debian 6.1 686 kernel and symbols
      run: |
        mkdir -p debian-debs debian-src
        get() { # file, snapshot path, pool path, sha256
          f=$1
          if [ ! -f "$f" ] || ! echo "$4  $f" | sha256sum -c --quiet; then
            curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$2" ||
              curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$3"
          fi
          echo "$4  $f" | sha256sum -c
        }
        start=$(date +%s)
        get debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          526c469c5148a2b61c4241c3f6575427096575e0ffef9541b6729351c600b3e4
        get debian-debs/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb \
          4625e3cd446ff2ade7776492bfdecd60b2fb6a72b8b99a97e04f0e472dfeeb84
        get debian-src/linux_6.1.176.orig.tar.xz pool/main/l/linux/linux_6.1.176.orig.tar.xz \
          pool/main/l/linux/linux_6.1.176.orig.tar.xz 9aad4025973feea3f0d978e82ab7db97d8d5ce3f59fcc6b1f316153d66e3a504
        get debian-src/linux_6.1.176-1.debian.tar.xz pool/main/l/linux/linux_6.1.176-1.debian.tar.xz \
          pool/main/l/linux/linux_6.1.176-1.debian.tar.xz 10477b04dc15f7c1c52d8c812c889be5fd37aa178163e352755cd137c73ade6b
        echo "Debian downloads: $(( $(date +%s) - start )) s"
        x="$RUNNER_TEMP/deb"
        mkdir -p "$x"
        dpkg-deb --fsys-tarfile debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb |
          tar -x -C "$x" ./boot/vmlinuz-6.1.0-50-686
        dpkg-deb --fsys-tarfile debian-debs/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb |
          tar -x -C "$x" ./usr/lib/debug/boot/vmlinux-6.1.0-50-686
        d=out/debian-6.1-686
        mkdir -p "$d"
        cp "$x/boot/vmlinuz-6.1.0-50-686" "$d/bzImage"
        site/gen-symbols.py --trim "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/symbols.json" debian-6.1-686
        site/gen-dwarf.js "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/dwarf"
        site/test_dwarf.py "$x/usr/lib/debug/boot/vmlinux-6.1.0-50-686" "$d/dwarf" --samples 5000 --types 2000 --cfi 5000 --locals 2000 --operands 2000 --lines 2000 --funcs 1000 --vars 2000 \
          --strip debian/build/build_i386_none_686/ --strip /build/reproducible-path/linux-6.1.176/
        cat "$d"/dwarf/[0-9a-f]*.bin | gzip -9 | wc -c | sed 's/^/debian dwarf shards gzip: /'
        cat "$d"/dwarf/cfi-*.bin | gzip -9 | wc -c | sed 's/^/debian cfi shards gzip: /'
        gzip -9 -c "$d/dwarf/types.json" | wc -c | sed 's/^/debian types.json gzip: /'
        gzip -9 -c "$d/dwarf/files.json" | wc -c | sed 's/^/debian files.json gzip: /'
        cat "$d"/dwarf/locals-*.json.gz | wc -c | sed 's/^/debian locals shards (gzipped files): /'
        cat "$d"/dwarf/funcs-*.json.gz | wc -c | sed 's/^/debian function facts shards (gzipped files): /'
        site/gen-debian-source.sh debian-src/linux_6.1.176.orig.tar.xz debian-src/linux_6.1.176-1.debian.tar.xz "$x/src"
        site/gen-src.js "$d/dwarf" "$x/src" "$d/src" \
          --origin "Debian's source package linux 6.1.176-1 (linux_6.1.176.orig.tar.xz with the patches of debian/patches/series from linux_6.1.176-1.debian.tar.xz)" \
          --note "arch/x86/include/generated/asm/syscalls_32.h=made by the build: regenerated with scripts/syscalltbl.sh --abis i386 from arch/x86/entry/syscalls/syscall_32.tbl" \
          --note "security/selinux/flask.h=made by the build: regenerated with scripts/selinux/genheaders"
        printf '%s\n' '{"label": "Debian 6.1 686 (no initrd: ends in a root-fs panic)", "cmdline": "nokaslr console=tty0 cryptomgr.notests", "ram": 67108864}' > "$d/meta.json"
        rm -rf "$x"
        gzip -9 -c "$d/symbols.json" | wc -c | sed 's/^/debian symbols.json gzip: /'
        echo "Debian step: $(( $(date +%s) - start )) s"
        ls -l "$d"

    # Debug data for the site only: a -g copy of each tree. The kernels that
    # boot are untouched; check-code-identity.py fails the job unless the -g
    # build's code and bzImage equal them (only the GNU build-id note, a hash
    # over the whole ELF including the debug info, may differ).
    - name: Debug-info builds, DWARF shards and C source
      run: |
        g="$RUNNER_TEMP/g"
        o="$RUNNER_TEMP/o0"
        rm -rf "$g" && mkdir -p "$g"
        cp -a hello "$g/"
        cp -a "$o/minified" "$g/minified"
        cp -a minified "$g/minified-os"
        cp -a "$RUNNER_TEMP/hello-os" "$g/hello-os"
        start=$(date +%s)
        make -C "$g/minified" clean
        make -C "$g/minified" LLVM=1 -j6 KCFLAGS="-g -O0"
        make -C "$g/minified-os" clean
        make -C "$g/minified-os" LLVM=1 -j6 KCFLAGS=-g
        echo "minified Linux -g builds: $(( $(date +%s) - start )) s"
        site/check-code-identity.py "$o/minified/vmlinux" "$o/minified/arch/x86/boot/bzImage" \
          "$g/minified/vmlinux" "$g/minified/arch/x86/boot/bzImage" --self-test
        site/check-code-identity.py minified/vmlinux minified/arch/x86/boot/bzImage \
          "$g/minified-os/vmlinux" "$g/minified-os/arch/x86/boot/bzImage" --self-test
        start=$(date +%s)
        make -C "$g/hello" clean
        make -C "$g/hello" LLVM=1 OPT=-O0 CC="clang -g"
        make -C "$g/hello-os" clean
        make -C "$g/hello-os" LLVM=1 CC="clang -g"
        echo "hello -g builds: $(( $(date +%s) - start )) s"
        site/check-code-identity.py hello/boot/high/kernel.elf hello/bzImage \
          "$g/hello/boot/high/kernel.elf" "$g/hello/bzImage" --self-test
        site/check-code-identity.py "$RUNNER_TEMP/hello-os/boot/high/kernel.elf" "$RUNNER_TEMP/hello-os/bzImage" \
          "$g/hello-os/boot/high/kernel.elf" "$g/hello-os/bzImage" --self-test
        site/gen-dwarf.js "$g/minified/vmlinux" out/minified-linux/dwarf
        site/gen-dwarf.js "$g/minified-os/vmlinux" out/minified-linux-os/dwarf
        site/gen-dwarf.js "$g/hello/boot/high/kernel.elf" out/hello/dwarf
        site/gen-dwarf.js "$g/hello-os/boot/high/kernel.elf" out/hello-os/dwarf
        site/gen-src.js out/minified-linux/dwarf "$g/minified" out/minified-linux/src --origin "the minified/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12) with site/unoptimized.patch (built with -O0)"
        site/gen-src.js out/minified-linux-os/dwarf "$g/minified-os" out/minified-linux-os/src --origin "the minified/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12)"
        site/gen-src.js out/hello/dwarf "$g/hello" out/hello/src --origin "the hello/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12)"
        site/gen-src.js out/hello-os/dwarf "$g/hello-os" out/hello-os/src --origin "the hello/ tree of commit $(echo "$GITHUB_SHA" | cut -c1-12)"
        site/test_dwarf.py "$g/minified/vmlinux" out/minified-linux/dwarf --samples 5000 --types 2000 --cfi 5000 --locals 3000 --operands 2000 --lines 3000 --funcs 2000 --vars 2000 --strip "$(realpath "$g/minified")/"
        site/test_dwarf.py "$g/minified-os/vmlinux" out/minified-linux-os/dwarf --samples 5000 --types 2000 --cfi 5000 --locals 3000 --operands 2000 --lines 3000 --funcs 2000 --vars 2000 --strip "$(realpath "$g/minified-os")/"
        site/test_dwarf.py "$g/hello/boot/high/kernel.elf" out/hello/dwarf --samples 500 --types 200 --cfi 200 --locals 200 --operands 200 --lines 200 --funcs 200 --vars 200 --strip "$(realpath "$g/hello")/"
        site/test_dwarf.py "$g/hello-os/boot/high/kernel.elf" out/hello-os/dwarf --samples 500 --types 200 --cfi 200 --locals 200 --operands 200 --lines 200 --funcs 200 --vars 200 --strip "$(realpath "$g/hello-os")/"
        site/test_dwarf.py --eh-frame 2000
        site/test_dwarf.py --inline-blocks
        # The page's compiler makes CI's objects: one object per kernel and
        # build (plain and -g) compiled again by clang.wasm from its exact
        # command line must equal the build's object byte for byte.
        hcmd() { d=$1; shift; make -s -n -B -C "$d" LLVM=1 "$@" boot/hello.o | /usr/bin/grep -- ' -o boot/hello.o '; }
        w=site/clang/clang.wasm
        node site/check-wasm-objects.mjs --self-test "$w" hello "boot/hello.o=$(hcmd hello OPT=-O0)"
        node site/check-wasm-objects.mjs "$w" "$RUNNER_TEMP/hello-os" "boot/hello.o=$(hcmd "$RUNNER_TEMP/hello-os")"
        node site/check-wasm-objects.mjs "$w" "$g/hello" "boot/hello.o=$(hcmd "$g/hello" OPT=-O0 CC="clang -g")"
        node site/check-wasm-objects.mjs "$w" "$g/hello-os" "boot/hello.o=$(hcmd "$g/hello-os" CC="clang -g")"
        node site/check-wasm-objects.mjs --self-test "$w" "$o/minified" fs/namei.o init/main.o
        node site/check-wasm-objects.mjs "$w" minified fs/namei.o init/main.o
        node site/check-wasm-objects.mjs "$w" "$g/minified" fs/namei.o init/main.o
        node site/check-wasm-objects.mjs "$w" "$g/minified-os" fs/namei.o init/main.o
        # The same under the page's own WASI (wasi.js), which also writes
        # the inputs of the clang-worker job: per object its argv, its
        # directory and every file the compile read.
        x="--own-wasi --fixture=clang-fixtures"
        node site/check-wasm-objects.mjs --self-test $x --name=hello "$w" hello "boot/hello.o=$(hcmd hello OPT=-O0)"
        node site/check-wasm-objects.mjs $x --name=hello-os "$w" "$RUNNER_TEMP/hello-os" "boot/hello.o=$(hcmd "$RUNNER_TEMP/hello-os")"
        node site/check-wasm-objects.mjs $x --name=hello-g "$w" "$g/hello" "boot/hello.o=$(hcmd "$g/hello" OPT=-O0 CC="clang -g")"
        node site/check-wasm-objects.mjs $x --name=hello-os-g "$w" "$g/hello-os" "boot/hello.o=$(hcmd "$g/hello-os" CC="clang -g")"
        node site/check-wasm-objects.mjs --self-test $x --name=minified "$w" "$o/minified" fs/namei.o init/main.o
        node site/check-wasm-objects.mjs $x --name=minified-os "$w" minified fs/namei.o init/main.o
        node site/check-wasm-objects.mjs $x --name=minified-g "$w" "$g/minified" fs/namei.o init/main.o
        node site/check-wasm-objects.mjs $x --name=minified-os-g "$w" "$g/minified-os" fs/namei.o init/main.o
        du -sh clang-fixtures
        # The -g ELFs for the browser test's llvm-symbolizer checks (not deployed).
        mkdir -p debug-elfs
        cp "$g/minified/vmlinux" debug-elfs/minified-linux.elf
        cp "$g/minified-os/vmlinux" debug-elfs/minified-linux-os.elf
        cp "$g/hello/boot/high/kernel.elf" debug-elfs/hello.elf
        cp "$g/hello-os/boot/high/kernel.elf" debug-elfs/hello-os.elf
        ls -l out/*/

    # The build's host tools for the page's Worker (plan E0d): nasm, hello's
    # tools/build and the minified Linux's mkpiggy and tools/build, built
    # for wasm32-wasip1 by the wasi-sdk gen-clang-wasm.sh pins
    # (gen-host-tools.py), and per kernel what the native tools (with
    # clang.wasm's ld.lld, llvm-objcopy, llvm-nm) read and wrote in the
    # steps after the compile, recorded by running those steps again
    # (capture-host-tools.py; the bzImages must come out the same). The
    # clang-worker job runs them in the browsers on the same inputs.
    - name: Host tools in wasm and what the build's tools read and wrote
      run: |
        eval "$(/usr/bin/grep -E '^WASI_SDK(_URL|_SHA256)?=' site/gen-clang-wasm.sh)"
        curl -sSfL --retry 5 -o "$RUNNER_TEMP/wasi-sdk.tgz" "$WASI_SDK_URL"
        echo "$WASI_SDK_SHA256  $RUNNER_TEMP/wasi-sdk.tgz" | sha256sum -c
        tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tgz"
        sdk="$RUNNER_TEMP/$WASI_SDK"
        m="$RUNNER_TEMP/hostwasm"
        o="$RUNNER_TEMP/o0"
        site/gen-host-tools.py --wasi-sdk "$sdk" nasm "$m/nasm"
        site/gen-host-tools.py --check "$m/nasm"
        site/gen-host-tools.py --wasi-sdk "$sdk" hello hello "$m/hello"
        site/gen-host-tools.py --wasi-sdk "$sdk" hello "$RUNNER_TEMP/hello-os" "$m/hello-os"
        site/gen-host-tools.py --wasi-sdk "$sdk" kbuild "$o/minified" "$m/minified"
        site/gen-host-tools.py --wasi-sdk "$sdk" kbuild minified "$m/minified-os"
        hello() { # name, tree, make args
          n=$1 t=$2; shift 2
          site/capture-host-tools.py --name "$n" --tree "$t" --out tool-fixtures \
            --tool tools/build --path-tool nasm --path-tool ld.lld --path-tool llvm-objcopy --path-tool llvm-nm \
            --module build="$m/$n/build.wasm" --module nasm="$m/nasm/nasm.wasm" \
            --module ld.lld=clang --module llvm-objcopy=clang --module llvm-nm=clang \
            --rm boot/head.o --rm boot/high/setup.bin --rm boot/low/setup.bin --rm boot/high/kernel.elf \
            --rm boot/low/kernel.elf --rm boot/high/kernel.bin --rm boot/low/kernel.bin --rm bzImage --rm bzImage.low \
            --same bzImage --same bzImage.low -- make LLVM=1 "$@"
        }
        hello hello hello OPT=-O0
        hello hello-os "$RUNNER_TEMP/hello-os"
        minified() { # name, tree, make args
          n=$1 t=$2; shift 2
          site/capture-host-tools.py --name "$n" --tree "$t" --out tool-fixtures \
            --tool arch/x86/boot/tools/build --tool arch/x86/boot/compressed/mkpiggy \
            --path-tool 'llvm-objcopy=arch/x86/boot/*' \
            --module build="$m/$n/build.wasm" --module mkpiggy="$m/$n/mkpiggy.wasm" --module llvm-objcopy=clang \
            --rm arch/x86/boot/compressed/vmlinux.bin --rm arch/x86/boot/setup.bin \
            --same arch/x86/boot/bzImage -- make LLVM=1 -j6 "$@"
        }
        minified minified "$o/minified" KCFLAGS=-O0
        minified minified-os minified
        cp "$m/nasm/LICENSE.nasm" tool-fixtures/modules/
        ls tool-fixtures/*.json | wc -l
        du -sh tool-fixtures

    - uses: actions/upload-artifact@v4
      with:
        name: kernels
        path: out/

    - uses: actions/upload-artifact@v4
      with:
        name: debug-elfs
        path: debug-elfs/

    - uses: actions/upload-artifact@v4
      with:
        name: gen-elfs
        path: gen-elfs/

    - uses: actions/upload-artifact@v4
      with:
        name: clang-fixtures
        path: clang-fixtures/

    - uses: actions/upload-artifact@v4
      with:
        name: tool-fixtures
        path: tool-fixtures/

  # Debian 6.1 686 rebuilt from its source package and config with the
  # native clang 22.1.0 (gen-debian-clang.sh, LLVM=1, bzImage only): the
  # kernel the page will rebuild in the browser (plan step E6). It boots in
  # qemu to the root-fs panic, and objects of it compiled again by
  # clang.wasm equal the build's. The page's Debian sample stays Debian's
  # own GCC-built binary.
  debian-clang:
    needs: [clang-native, clang-wasm]
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
    - name: Install packages
      run: |
        apt-get update
        apt-get install -y build-essential flex bison bc libelf-dev libssl-dev python3 cpio kmod xz-utils patch curl nodejs qemu-system-x86

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: clang-native
        path: site/clang-native

    - uses: actions/download-artifact@v4
      with:
        name: clang-wasm
        path: site/clang

    - name: Native clang 22.1.0 first in PATH
      run: |
        site/gen-clang-native.sh --check
        site/gen-clang-wasm.sh --check
        mkdir -p /opt/clang-22 && tar -C /opt/clang-22 -xf site/clang-native/clang-native.tar
        echo /opt/clang-22/bin >> "$GITHUB_PATH"
        /opt/clang-22/bin/clang --version

    # The kernels job's pinned source package (same cache key) and the
    # image package for its config.
    - uses: actions/cache/restore@v4
      with:
        path: debian-src
        key: debian-src-6.1.176-1-9aad4025973f-10477b04dc15

    - name: Debian source and config
      run: |
        mkdir -p debian-src
        get() { # file, pool path, sha256
          if [ ! -f "$1" ] || ! echo "$3  $1" | sha256sum -c --quiet; then
            curl -sSfL --retry 3 -o "$1" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$2" ||
              curl -sSfL --retry 3 -o "$1" "https://deb.debian.org/debian/$2"
          fi
          echo "$3  $1" | sha256sum -c
        }
        get debian-src/linux_6.1.176.orig.tar.xz pool/main/l/linux/linux_6.1.176.orig.tar.xz \
          9aad4025973feea3f0d978e82ab7db97d8d5ce3f59fcc6b1f316153d66e3a504
        get debian-src/linux_6.1.176-1.debian.tar.xz pool/main/l/linux/linux_6.1.176-1.debian.tar.xz \
          10477b04dc15f7c1c52d8c812c889be5fd37aa178163e352755cd137c73ade6b
        get "$RUNNER_TEMP/image.deb" pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb \
          526c469c5148a2b61c4241c3f6575427096575e0ffef9541b6729351c600b3e4
        dpkg-deb --fsys-tarfile "$RUNNER_TEMP/image.deb" | tar -x -O ./boot/config-6.1.0-50-686 > "$RUNNER_TEMP/config"
        site/gen-debian-source.sh debian-src/linux_6.1.176.orig.tar.xz debian-src/linux_6.1.176-1.debian.tar.xz "$RUNNER_TEMP/deb"

    - name: Build with clang 22
      run: site/gen-debian-clang.sh "$RUNNER_TEMP/deb" "$RUNNER_TEMP/config"

    - name: Boot in qemu (to the root-fs panic)
      run: |
        d="$RUNNER_TEMP/deb"
        mkdir -p out
        timeout 900 qemu-system-i386 -m 256M -nographic -no-reboot -kernel "$d/arch/x86/boot/bzImage" \
          -append "console=ttyS0 panic=-1 nokaslr" < /dev/null > out/boot.log 2>&1 || true
        tail -5 out/boot.log
        /usr/bin/grep -q "Linux version 6.1.176 .*clang version 22.1.0" out/boot.log
        /usr/bin/grep -q "Kernel panic - not syncing: VFS: Unable to mount root fs" out/boot.log
        if sed '/Kernel panic - not syncing/q' out/boot.log | /usr/bin/grep -E "WARNING:|BUG:|Oops|Call Trace"; then
          echo "the clang-built Debian kernel warned before the root-fs panic" >&2; exit 1
        fi

    # recordmcount rewrites the kernel's objects after the compile (the
    # command kbuild keeps in .cmd), so those are compared with the native
    # compiler's output of the same command; the decompressor's objects
    # (no mcount calls) with the build's.
    - name: Objects compiled again by clang.wasm equal the native clang's
      run: |
        node site/check-wasm-objects.mjs --self-test --native-rerun site/clang/clang.wasm "$RUNNER_TEMP/deb" \
          fs/open.o kernel/sched/core.o
        node site/check-wasm-objects.mjs site/clang/clang.wasm "$RUNNER_TEMP/deb" \
          arch/x86/boot/compressed/misc.o arch/x86/boot/compressed/string.o
        # Under the page's own WASI (wasi.js), in this Node process with V8's
        # fast API calls on; the inputs of the clang-worker job.
        node site/check-wasm-objects.mjs --native-rerun --own-wasi --fixture=clang-fixtures --name=debian \
          site/clang/clang.wasm "$RUNNER_TEMP/deb" fs/open.o kernel/sched/core.o
        du -sh clang-fixtures

    # The host tools of this build in wasm, and what the native ones read
    # and wrote after the compile (as in the kernels job): recordmcount on
    # the two objects above, kallsyms and sorttable in the vmlinux link,
    # relocs, mkpiggy, tools/build and llvm-objcopy of the bzImage.
    - name: Host tools in wasm and what the build's tools read and wrote
      run: |
        eval "$(/usr/bin/grep -E '^WASI_SDK(_URL|_SHA256)?=' site/gen-clang-wasm.sh)"
        curl -sSfL --retry 5 -o "$RUNNER_TEMP/wasi-sdk.tgz" "$WASI_SDK_URL"
        echo "$WASI_SDK_SHA256  $RUNNER_TEMP/wasi-sdk.tgz" | sha256sum -c
        tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tgz"
        d="$RUNNER_TEMP/deb"
        m="$RUNNER_TEMP/hostwasm/debian"
        site/gen-host-tools.py --wasi-sdk "$RUNNER_TEMP/$WASI_SDK" kbuild "$d" "$m"
        start=$(date +%s)
        site/capture-host-tools.py --name debian --tree "$d" --out tool-fixtures \
          --tool scripts/kallsyms --tool scripts/sorttable --tool 'scripts/recordmcount=fs/open.o,kernel/sched/core.o' \
          --tool arch/x86/tools/relocs --tool arch/x86/boot/tools/build --tool arch/x86/boot/compressed/mkpiggy \
          --path-tool 'llvm-objcopy=arch/x86/boot/*' --extra sorttable=System.map \
          --module kallsyms="$m/kallsyms.wasm" --module sorttable="$m/sorttable.wasm" \
          --module recordmcount="$m/recordmcount.wasm" --module relocs="$m/relocs.wasm" \
          --module build="$m/build.wasm" --module mkpiggy="$m/mkpiggy.wasm" --module llvm-objcopy=clang \
          --rm vmlinux --rm fs/open.o --rm kernel/sched/core.o \
          --same arch/x86/boot/bzImage -- "$PWD/site/gen-debian-clang.sh" --make "$d"
        echo "relink with the tools recorded: $(( $(date +%s) - start )) s"
        ls tool-fixtures/*.json | wc -l
        du -sh tool-fixtures

    - name: Collect
      run: |
        d="$RUNNER_TEMP/deb"
        cp "$d/arch/x86/boot/bzImage" "$d/.config" "$d/config.diff" out/
        ls -l out

    - uses: actions/upload-artifact@v4
      with:
        name: debian-clang
        path: out/

    - uses: actions/upload-artifact@v4
      with:
        name: clang-fixtures-debian
        path: clang-fixtures/

    - uses: actions/upload-artifact@v4
      with:
        name: tool-fixtures-debian
        path: tool-fixtures/

  # Debian's initramfs for the Debian 6.1 686 sample, built by Debian's
  # own initramfs-tools (mkinitramfs) in an i386 bookworm container from
  # the same pinned kernel package and snapshot date; cached by the
  # script's hash and the package hash.
  debian-initrd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      id: cache
      with:
        path: initrd-out
        key: debian-initrd-${{ hashFiles('site/gen-debian-initrd.sh') }}-526c469c5148

    - name: Debian 6.1 686 initramfs
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p debian-debs initrd-out
        f=debian-debs/linux-image-6.1.0-50-686_6.1.176-1_i386.deb
        p=pool/main/l/linux-signed-i386/linux-image-6.1.0-50-686_6.1.176-1_i386.deb
        curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$p" ||
          curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$p"
        echo "526c469c5148a2b61c4241c3f6575427096575e0ffef9541b6729351c600b3e4  $f" | sha256sum -c
        start=$(date +%s)
        docker run --rm --platform linux/386 -v "$PWD:/w" -w /w debian:bookworm-slim \
          sh site/gen-debian-initrd.sh "$f" initrd-out/initrd.img
        echo "initramfs build: $(( $(date +%s) - start )) s"

    - run: ls -l initrd-out

    - uses: actions/upload-artifact@v4
      with:
        name: debian-initrd
        path: initrd-out/

  # The page's v86.wasm and libv86.js: v86's source at the pinned commit with
  # site/v86-det.patch, built in the pinned Docker image (gen-v86.sh, R4, M1);
  # the script fails unless the builds have the recorded SHA-256 and the
  # unpatched libv86.js is npm's.
  v86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The last build of this script and patch: used only when the build
    # cannot run (snapshot.ubuntu.com or another download down), and
    # checked against the recorded SHA-256 then.
    - uses: actions/cache/restore@v4
      id: v86cache
      with:
        path: v86-cache
        key: v86-wasm-${{ hashFiles('site/gen-v86.sh', 'site/v86-det.patch') }}

    # The runner's resolver stopped answering for *.ubuntu.com inside
    # docker builds (runs 43047910102 to 43058718914: "Could not resolve
    # 'archive.ubuntu.com'", one of canonical.com's name servers down) while
    # public resolvers answered: the builds use those.
    - name: Docker DNS
      run: |
        cfg=/etc/docker/daemon.json
        { sudo cat "$cfg" 2>/dev/null || echo '{}'; } | jq '. + {dns: ["1.1.1.1", "8.8.8.8", "9.9.9.9"]}' > "$RUNNER_TEMP/daemon.json"
        sudo cp "$RUNNER_TEMP/daemon.json" "$cfg"
        cat "$cfg"
        sudo systemctl restart docker
        docker run --rm ubuntu:24.04 getent hosts archive.ubuntu.com snapshot.ubuntu.com || true

    - name: Build v86.wasm
      id: build
      run: |
        start=$(date +%s)
        if site/gen-v86.sh; then
          echo "v86.wasm and libv86.js build: $(( $(date +%s) - start )) s"
          mkdir -p v86-cache && cp site/v86/v86.wasm site/v86/libv86.js v86-cache/
          echo built=1 >> "$GITHUB_OUTPUT"
        elif [ -f v86-cache/v86.wasm ] && [ -f v86-cache/libv86.js ]; then
          echo "::warning::gen-v86.sh could not build v86.wasm and libv86.js; using the cached build of the same script and patch"
          mkdir -p site/v86 && cp v86-cache/v86.wasm v86-cache/libv86.js site/v86/
          site/gen-v86.sh --check
        else
          exit 1
        fi
        ls -l site/v86/v86.wasm site/v86/libv86.js

    - uses: actions/cache/save@v4
      if: steps.build.outputs.built == '1' && steps.v86cache.outputs.cache-hit != 'true'
      with:
        path: v86-cache
        key: v86-wasm-${{ hashFiles('site/gen-v86.sh', 'site/v86-det.patch') }}

    - uses: actions/upload-artifact@v4
      with:
        name: v86-wasm
        path: |
          site/v86/v86.wasm
          site/v86/libv86.js

  # clang/lld 22.1.0 for wasm32-wasip1 (gen-clang-wasm.sh): clang-wasm.yml
  # builds it when the script changes and caches it; this run checks it.
  clang-wasm:
    uses: ./.github/workflows/clang-wasm.yml

  # The native clang/lld 22.1.0 the kernels are built with
  # (gen-clang-native.sh): clang-native.yml builds it when the script
  # changes and caches it; this run checks it.
  clang-native:
    uses: ./.github/workflows/clang-native.yml

  site:
    needs: [kernels, debian-initrd, v86, clang-wasm]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: v86-wasm
        path: site/v86

    - uses: actions/download-artifact@v4
      with:
        name: clang-wasm
        path: site/clang

    - uses: actions/download-artifact@v4
      with:
        name: kernels
        path: site/kernels

    # A variant of the Debian sample: same bzImage and symbols, with its
    # initramfs; "break" stops Debian's init at the (initramfs) shell.
    - uses: actions/download-artifact@v4
      with:
        name: debian-initrd
        path: site/kernels/debian-6.1-686-initrd

    - name: Debian 6.1 686 with its initramfs
      run: |
        d=site/kernels/debian-6.1-686-initrd
        echo debian-6.1-686 > "$d/base"
        printf '%s\n' '{"label": "Debian 6.1 686 with its initramfs (BusyBox shell)", "cmdline": "nokaslr console=tty0 cryptomgr.notests break", "ram": 134217728}' > "$d/meta.json"
        ls -l "$d"

    - name: Assemble the site
      run: |
        site/check-ids.py
        site/check-text.py
        site/check-legend.py
        # The source editor's diff, patch writer and patch reader against git.
        node site/test_srcedit.mjs
        # The vendored LZ4 module (snapshots) is the pinned upstream file.
        site/gen-lz4.py --check
        # Which commit is deployed: shown in the page header.
        python3 -c 'import json, os, subprocess
        g = lambda f: subprocess.run(["git", "log", "-1", "--format=" + f], capture_output=True, text=True).stdout.strip()
        json.dump({"sha": os.environ["GITHUB_SHA"], "date": g("%cI"), "subject": g("%s"),
                   "run_id": os.environ["GITHUB_RUN_ID"], "run_number": os.environ["GITHUB_RUN_NUMBER"],
                   "repo": os.environ["GITHUB_REPOSITORY"]}, open("site/version.json", "w"))'
        cat site/version.json
        site/gen-kernels.sh
        # Every kernel has the data files of every debug feature.
        site/test_kernel_data.py
        site/fetch-v86.sh
        # The v86 job's build, checked again here.
        site/gen-v86.sh --check
        # The clang-wasm job's files, checked again here.
        site/gen-clang-wasm.sh --check
        # Cache busting: Pages serves with max-age=600, and a browser that
        # keeps an older app.js next to a newer index.html breaks. stamp.py
        # puts ?v=<commit> on every script and stylesheet of index.html and
        # the commit into sw.js (a new service worker and caches per deploy).
        site/stamp.py site "$GITHUB_SHA"
        # The web app: every file sw.js precaches is in the site, the
        # manifest and its icons are valid under the Pages subpath.
        site/check-pwa.py site --subpath "/$(basename "$GITHUB_REPOSITORY")/"

    # The browser test runs in its own job (browser-test below) so the
    # deploy does not wait ~11 minutes for it; a failing test still fails
    # the workflow run.
    # Without clang/ (77 MB, not loaded by the page yet): every
    # browser-test job downloads this artifact.
    - uses: actions/upload-artifact@v4
      with:
        name: site
        path: |
          site/
          !site/clang/

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

  # Install the page as a web app in Chromium with a window (Xvfb):
  # beforeinstallprompt fires, PWA.install, PWA.launch opens it standalone
  # and hello boots there. Locally deployed copy plus four broken copies
  # that must fail; then the live site once it is deployed. Headless
  # Chromium never offers to install (site/test_pwa_install.py).
  pwa-install:
    needs: [site, deploy]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-v1

    - name: Install Playwright, Chromium and Xvfb
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright pillow
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium
        sudo apt-get install -y xvfb

    - name: Install the local copy, the broken copies must fail
      env:
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: xvfb-run -a -s "-screen 0 1400x1000x24" "$RUNNER_TEMP/venv/bin/python" site/test_pwa_install.py

    # page_url is http:// for a custom domain; installing needs https.
    - name: Install the live site
      env:
        PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: xvfb-run -a -s "-screen 0 1400x1000x24" "$RUNNER_TEMP/venv/bin/python" site/test_pwa_install.py --base "https://${PAGE_URL#*://}"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pwa-install-screenshots
        path: site/test-screenshots/

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-raw-pwa
        path: jscov-raw/

  # The suites in parallel jobs, grouped to take about the same time; each group
  # plain (every assertion) and with coverage (site/jscov.py: up to ~3x slower
  # JavaScript, so timing bounds may fail there; the jscov job judges that run).
  browser-test:
    needs: site
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coverage: [false, true]
        suites:
        - boot,symbols,debugger,misc,touch,tasks_minified,hello,firstlook
        - debian,dwarf,dwarf_import,runto,initramfs,coverage,navhist,tipmarks,legend,tabs,pwa
        - tasks,operands,runto_phone,srclinks,unoptimized,jumps
        - types,covtree,unwind,lineaddr,fnfacts,branches,nopath,cfi,dwarf_lto,dwarf_forms
        - runstate
        - speedline
        - speedasm,runbadge,memeip,graphopen,srcfiles,srcedit
        - snapdiff,bookmarks,deltasnap
        - jitdet,guestin,replay
        - jitsnap
        - jitrev
        - reverse
        - exactstop
        - followeip
        - followfuzz
        - memevents
    name: browser-test (${{ matrix.suites }})${{ matrix.coverage && ' coverage' || '' }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-v1

    # -g ELFs for the DWARF checks (llvm-symbolizer, gdb): the minified Linux's and hello's from
    # the kernels job, Debian's -dbg vmlinux from the cached package.
    - uses: actions/download-artifact@v4
      with:
        name: debug-elfs
        path: debug-elfs

    # Its own cache: the kernels job's is written from a container (other
    # compression, so another cache version on this runner).
    - uses: actions/cache@v4
      with:
        path: debian-dbg
        key: browser-debian-686-dbg-6.1.176-1-4625e3cd446f

    - name: Debian vmlinux and llvm-symbolizer
      run: |
        f=debian-dbg/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb
        p=pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb
        sum=4625e3cd446ff2ade7776492bfdecd60b2fb6a72b8b99a97e04f0e472dfeeb84
        mkdir -p debian-dbg
        if ! echo "$sum  $f" | sha256sum -c --quiet; then
          curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$p" ||
            curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$p"
        fi
        echo "$sum  $f" | sha256sum -c
        dpkg-deb --fsys-tarfile "$f" | tar -x -O ./usr/lib/debug/boot/vmlinux-6.1.0-50-686 > debug-elfs/debian-6.1-686.elf
        sudo apt-get update
        # lz4: snapdiff checks the downloaded snapshot with `lz4 -d`; lld:
        # the cfi suite links its fixture (llvm-mc assembles it).
        sudo apt-get install -y llvm lld gdb lz4
        ls -l debug-elfs

    - name: Install Playwright and Chromium
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium

    - name: Browser test (${{ matrix.suites }})
      continue-on-error: ${{ matrix.coverage }}
      env:
        MKB_DEBUG_ELF_DIR: ${{ github.workspace }}/debug-elfs
        MKB_JSCOV: ${{ matrix.coverage && format('{0}/jscov-raw', github.workspace) || '' }}
      run: '"$RUNNER_TEMP/venv/bin/python" site/test_browser.py --suites "${{ matrix.suites }}"'

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-screenshots-${{ strategy.job-index }}
        path: site/test-screenshots/

    - uses: actions/upload-artifact@v4
      if: always() && matrix.coverage
      with:
        name: jscov-raw-${{ strategy.job-index }}
        path: jscov-raw/

  # The page's toolchain (clang.js, clangworker.js, wasi.js) in Chromium,
  # Firefox and WebKit: CI's objects of hello, the minified Linux and
  # Debian compiled again in the page's Worker from the inputs the builds
  # read must equal CI's (site/test_clang_worker.py). Chromium's run
  # counts for jscov.
  clang-worker:
    needs: [site, clang-wasm, debian-clang]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - uses: actions/download-artifact@v4
      with:
        name: clang-wasm
        path: site/clang

    - uses: actions/download-artifact@v4
      with:
        pattern: clang-fixtures*
        merge-multiple: true
        path: clang-fixtures

    - uses: actions/download-artifact@v4
      with:
        pattern: tool-fixtures*
        merge-multiple: true
        path: tool-fixtures

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-firefox-webkit-${{ runner.os }}-v1

    - name: Install Playwright, Chromium, Firefox and WebKit
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium firefox webkit

    # site/testdata/wasi-probe.c for the test's WASI checks, by the
    # wasi-sdk that gen-clang-wasm.sh pins.
    - name: Build wasi-probe.wasm with wasi-sdk
      run: |
        eval "$(/usr/bin/grep -E '^WASI_SDK(_URL|_SHA256)?=' site/gen-clang-wasm.sh)"
        curl -sSfL --retry 5 -o "$RUNNER_TEMP/wasi-sdk.tgz" "$WASI_SDK_URL"
        echo "$WASI_SDK_SHA256  $RUNNER_TEMP/wasi-sdk.tgz" | sha256sum -c
        tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wasi-sdk.tgz"
        "$RUNNER_TEMP/$WASI_SDK/bin/clang" --target=wasm32-wasip1 -O2 -Wall -Werror \
          -o clang-fixtures/wasi-probe.wasm site/testdata/wasi-probe.c

    - name: Compile in the page's Worker, compare with CI's objects
      env:
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: |
        site/gen-clang-wasm.sh --check
        ls -l clang-fixtures
        ls tool-fixtures/*.json | wc -l
        "$RUNNER_TEMP/venv/bin/python" site/test_clang_worker.py --fixtures clang-fixtures \
          --tool-fixtures tool-fixtures --browsers chromium,firefox,webkit --json clang-worker.json

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clang-worker-results
        path: clang-worker.json

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-raw-clang-worker
        path: jscov-raw/

  # The generators in the page's Worker (plan E1: genworker.js, kgen.js,
  # llvm-nm and llvm-objdump of clang.wasm): from the ELFs CI's generators
  # read, every shipped kernel's symbols.json, disasm.json, dwarf/ and src/
  # made again in Chromium, Firefox and WebKit must equal the site's files
  # (site/test_gen_worker.py: gzip compared unpacked). Then the import of a
  # vmlinux that uses them, end to end in Chromium (test_browser.py
  # genimport). Chromium's runs count for jscov.
  gen-worker:
    needs: [site, clang-wasm]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - uses: actions/download-artifact@v4
      with:
        name: clang-wasm
        path: site/clang

    - uses: actions/download-artifact@v4
      with:
        name: debug-elfs
        path: gen-elfs

    - uses: actions/download-artifact@v4
      with:
        name: gen-elfs
        path: gen-elfs

    - uses: actions/cache@v4
      with:
        path: debian-dbg
        key: browser-debian-686-dbg-6.1.176-1-4625e3cd446f

    - name: Debian vmlinux
      run: |
        f=debian-dbg/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb
        p=pool/main/l/linux/linux-image-6.1.0-50-686-dbg_6.1.176-1_i386.deb
        sum=4625e3cd446ff2ade7776492bfdecd60b2fb6a72b8b99a97e04f0e472dfeeb84
        mkdir -p debian-dbg
        if ! echo "$sum  $f" | sha256sum -c --quiet; then
          curl -sSfL --retry 3 -o "$f" "https://snapshot.debian.org/archive/debian/20260704T211317Z/$p" ||
            curl -sSfL --retry 3 -o "$f" "https://deb.debian.org/debian/$p"
        fi
        echo "$sum  $f" | sha256sum -c
        dpkg-deb --fsys-tarfile "$f" | tar -x -O ./usr/lib/debug/boot/vmlinux-6.1.0-50-686 > gen-elfs/debian-6.1-686.elf
        ls -l gen-elfs

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-firefox-webkit-${{ runner.os }}-v1

    - name: Install Playwright, Chromium, Firefox and WebKit
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium firefox webkit

    - name: Generators in the page's Worker, compared with CI's files
      env:
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
      run: |
        site/gen-clang-wasm.sh --check
        "$RUNNER_TEMP/venv/bin/python" site/test_gen_worker.py --elfs gen-elfs \
          --browsers chromium,firefox,webkit --json gen-worker.json

    - name: An imported vmlinux gets the files (test_browser.py genimport)
      env:
        MKB_JSCOV: ${{ github.workspace }}/jscov-raw
        MKB_DEBUG_ELF_DIR: ${{ github.workspace }}/gen-elfs
      run: '"$RUNNER_TEMP/venv/bin/python" site/test_browser.py --suites genimport'

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gen-worker-results
        path: |
          gen-worker.json
          site/test-screenshots/

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-raw-gen-worker
        path: jscov-raw/

  # e2e coverage of the site's JavaScript (the coverage browser-test jobs
  # and pwa-install): merged, reported, and held to the committed floor
  # site/jscov-baseline.json. Runs when a test job failed too.
  jscov:
    needs: [browser-test, pwa-install, clang-worker, gen-worker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: jscov-raw-*
        path: jscov-raw

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-v1

    # monocart-coverage-reports and its dependencies at the versions and
    # SHA-512 integrity hashes of site/jscov/package-lock.json.
    - name: Install the report tool, Playwright and Chromium
      run: |
        npm ci --prefix site/jscov --ignore-scripts --no-audit --no-fund
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install playwright
        "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium

    - name: Self-test (an unexecuted function shows as uncovered)
      run: '"$RUNNER_TEMP/venv/bin/python" site/test_jscov.py'

    # The tests ran the deployed files: sw.js and index.html stamped with
    # the commit (the site job), so the same stamp here.
    - name: Merge and report, check the baseline
      run: |
        site/stamp.py site "$GITHUB_SHA"
        node site/jscov/report.js --src site --out jscov-report --baseline site/jscov-baseline.json \
          --uncovered site/jscov-uncovered.tsv --summary "$GITHUB_STEP_SUMMARY" jscov-raw

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jscov-report
        path: jscov-report/
