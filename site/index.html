<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernel in the browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Kernel in the browser<span class="tip" tabindex="0" title="Boots a bzImage in v86, an x86 emulator compiled to WebAssembly (github.com/copy/v86). Pick a kernel from the list or load any bzImage from disk.">?</span></h1>
</header>

<main>
<section class="controls" aria-label="Machine">
  <label>Kernel
    <select id="kernel"></select>
  </label>
  <label>RAM
    <select id="memory">
      <option value="2097152">2 MB</option>
      <option value="4194304">4 MB</option>
      <option value="18874368">18 MB</option>
      <option value="33554432">32 MB</option>
    </select>
  </label>
  <label title="Load any bzImage from your disk instead of the list">From disk
    <input type="file" id="file">
  </label>
  <button id="boot" type="button">Boot</button>
  <span id="status" role="status">Loading kernel list...</span>
  <span id="kinfo" class="note mono"></span>
</section>
<div id="problems"></div>

<div class="cols">
<div class="col-left">
<section aria-label="Screen">
  <div id="screen_container">
    <div id="screen_text"></div>
    <canvas id="screen_canvas" style="display: none"></canvas>
  </div>
</section>

<section aria-label="Snapshots">
  <h2>Snapshots <span class="tip" tabindex="0" title="A snapshot is v86 save_state(): CPU, devices, VGA memory and all guest RAM, gzip-compressed in the browser (CompressionStream). The last 8 are kept in memory; Restore puts the VM back, Download saves the file.">?</span></h2>
  <span id="snap_note" class="note"></span>
  <div class="scan">
    <button id="snap_save" type="button" disabled>Save snapshot</button>
    <span id="snap_status" role="status"></span>
  </div>
  <div class="table-wrap">
    <table id="snapshots" hidden>
      <thead><tr><th>#</th><th>taken</th><th>kernel, RAM</th><th>raw bytes</th><th>gzip bytes</th><th>ratio</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
</div>
<div class="col-right">
<section aria-label="Memory">
  <h2>Physical memory <span class="tip" tabindex="0" title="Regions follow from the boot header and from where v86 puts things: real-mode setup at 0x80000, command line at 0x8e000, the 32-bit part always at 1 MiB. SeaBIOS builds the e820 map from the RAM size: usable RAM with the 0x9fc00-0x100000 hole reserved.">?</span></h2>
  <h3>First MiB</h3>
  <div class="bar" id="map_low"></div>
  <h3>All RAM (<span id="ram_label"></span>)</h3>
  <div class="bar" id="map_all"></div>
  <ul class="legend" id="legend"></ul>

  <div class="scan">
    <button id="scan" type="button" disabled>Scan memory</button>
    <label title="Rescan all pages every second"><input type="checkbox" id="autoscan"> auto</label>
    <span id="footprint"></span> <span class="tip" tabindex="0" title="Each square is a 4 KiB page of guest RAM, coloured by region (boot header) and, when the kernel has a symbols.json, by ELF section. Pale squares were all zero at the last scan; a dot marks pages that changed between the last two scans. Non-zero pages below 1 MiB include SeaBIOS leftovers and the BIOS copies at 0xc0000-0xfffff. Hover a page for its symbols, click to inspect it.">?</span>
  </div>
  <canvas id="pages" width="448" height="14"></canvas>
  <ul class="legend" id="grid_legend"></ul>
  <p class="note mono" id="focus_info" aria-live="polite"></p>
  <p class="note" id="hover_info" aria-live="polite"></p>

  <div id="inspector">
    <h3 id="page_title">No page selected</h3>
    <div class="scan">
      <span class="tabs"><button id="view_hex" type="button" aria-pressed="true">hex</button>
        <button id="view_asm" type="button" aria-pressed="false" title="Disassembly from llvm-objdump of the kernel ELF at build time. Highlighted lines: the bytes in guest memory differ from the build (not loaded yet, overwritten or freed).">asm</button></span>
      <label title="Re-read the selected page every 500 ms. Marked bytes differ from the last scan (or, right after a scan, from the scan before it)."><input type="checkbox" id="live"> live</label>
      <span id="dump_info"></span>
    </div>
    <pre id="hexdump">Click a page in the grid above.</pre>
    <p class="note" id="symbols_note"></p>
    <div class="table-wrap">
      <table id="page_symbols">
        <thead><tr><th>symbol</th><th>address</th><th>physical</th><th>size</th><th>section</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

</div>
</div>

</main>

<script src="v86/libv86.js"></script>
<script src="app.js"></script>
</body>
</html>
