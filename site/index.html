<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernel in the browser</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Boot the minified Linux, a hello kernel or Debian's kernel in v86 and step through it with a debugger, its memory map, call graph and C source.">
</head>
<body>
<header class="top">
  <div class="headline">
    <h1>Kernel in the browser<span class="tip" tabindex="0" role="button" title="Boots a bzImage in v86, an x86 emulator compiled to WebAssembly (github.com/copy/v86). The kernel, RAM, files to load and Boot are in the Machine tab; see the About tab.">?</span></h1>
  </div>

  <!-- The tab bar: TabBar in tabs.jsx (shell.jsx mounts it). -->
  <div class="tabrow" id="tabrow"></div>
</header>

<main>
<section class="panel" id="panel_machine" role="tabpanel" aria-labelledby="tab_machine">
  <div class="mstatus">
    <span id="status" role="status">Loading kernel list...</span>
  </div>
  <div id="problems" class="problems"></div>
  <div id="pwa_notes" class="problems" role="status"></div>

  <div class="machine">
    <div class="screenwrap">
      <div id="screen_container" title="The VGA text screen (click it and type: the keys go to the VM)">
        <div id="screen_text"></div>
        <canvas id="screen_canvas" style="display: none"></canvas>
      </div>
      <div id="vm_overlay" hidden><b>VM paused</b><span id="vm_reason"></span><button id="vm_continue" type="button">&#9654; Continue</button></div>
    </div>
    <div class="run">
      <div class="runbar">
        <button id="dbg_pause" type="button" disabled title="Stop the CPU">Pause</button>
        <button id="dbg_continue" type="button" disabled title="Run again at the selected speed">Continue</button>
        <button id="dbg_step" type="button" disabled title="Execute one instruction">Step</button>
        <button id="dbg_back" type="button" disabled title="Undo the last instruction">Step back</button>
        <label><span>speed<span class="tip" tabindex="0" role="button" title="Instructions per second from the kernel entry on. By default BIOS and setup are stepped as fast as possible up to the kernel's 32-bit entry at 0x100000, then the kernel runs at 1k/s so you can watch it. Full speed is v86's JIT: on the virtual clock the page runs it one slice (about 100,000 instructions) at a time, counted, and a run repeats exactly; with the real-time clock v86 runs it on its own, not counted. 10M/s is more than JavaScript stepping reaches on most machines (about 5M/s on a fast desktop); the speed actually reached is shown next to the clock. The choice is remembered in this browser; ?speed=full (or 1000000, 100000, ..., 1) in the URL overrides it.">?</span></span>
          <select id="dbg_speed">
            <option value="full">full (JIT)</option>
            <option value="10000000">10M/s</option>
            <option value="1000000">1M/s</option>
            <option value="100000">100k/s</option>
            <option value="10000">10k/s</option>
            <option value="1000">1k/s</option>
            <option value="100">100/s</option>
            <option value="10">10/s</option>
            <option value="1">1/s</option>
          </select>
        </label>
        <label><span>clock<span class="tip" tabindex="0" role="button" title="Guest time while the page steps the CPU. Virtual (default 10 instructions per microsecond, like a 10 MHz CPU; qemu -icount does the same): time advances with the instruction count, so the timer interrupt (IRQ0, 250 Hz in the minified Linux: one every 40,000 instructions at 10/us) arrives at the same instruction whatever the stepping speed, and the counts are the same every run. The minified Linux's count from its entry does not depend on this rate (132,006 instructions to Still alive); the from-reset count does, through SeaBIOS's waits. When the CPU halts the clock jumps to the next timer event. Real: v86's wall clock; at 1k/s the guest then sees a timer interrupt every few instructions. At full JIT speed the virtual clock follows v86's instruction counter, with compiled code going live only between two slices, so full-speed runs repeat exactly; real time there is v86's own loop, faster or slower with the machine and different every run. ?mips=10, 100, 1000 or real in the URL; the choice is remembered.">?</span></span>
          <select id="clock_mips">
            <option value="10" selected>10/&micro;s</option>
            <option value="100">100/&micro;s</option>
            <option value="1000">1000/&micro;s</option>
            <option value="real">real time</option>
          </select>
        </label>
        <label><input type="checkbox" id="count" checked> count<span class="tip" tabindex="0" role="button" title="At full speed: first step the whole boot from the reset vector in the background until both lines are on the screen, counting, then run the JIT. At the other speeds the boot is always counted live. Remembered in this browser (Settings tab); ?count=0 in the URL turns it off for one visit.">?</span></label>
        <span id="dbg_state" class="note"></span>
      </div>
      <div class="table-wrap">
        <table id="counters" class="mono">
          <thead><tr>
            <th>until<span class="tip" tabindex="0" role="button" title="Instructions executed until each line first appears in VGA text memory at 0xb8000, until the first exit or exit_group system call (int 0x80, EAX 1 or 252; the code is EBX), and until the end: the CPU enters panic() (symbols.json) or halts with interrupts off. Counted from the kernel entry at 1 MiB and from the reset vector. Stepping and slow motion stop at the end.">?</span></th>
            <th>from 1 MiB<span class="tip" tabindex="0" role="button" title="Instructions executed from the first one at physical 0x100000, where v86 puts the 32-bit kernel.">?</span></th>
            <th>unique EIPs k/o<span class="tip" tabindex="0" role="button" title="Distinct physical addresses executed from reset: in the kernel range (1 MiB to 1 MiB + init_size) / elsewhere (BIOS, option ROM, real-mode setup).">?</span></th>
            <th>from reset<span class="tip" tabindex="0" role="button" title="Instructions executed from the reset vector (SeaBIOS, the kernel's real-mode setup, the kernel).">?</span></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="note mono" id="vclock"></p>
      <p class="note mono" id="guest_in"><span id="guest_in_text"></span><span id="guest_keys"></span> <span class="tip" tabindex="0" role="button" title="What the guest reads from outside the CPU. On the virtual clock the RTC (CMOS clock: the date the kernel and SeaBIOS read) starts at a fixed date when the machine is powered on and runs with the virtual time, and RDRAND and the network card's MAC address come from a random number generator started from a seed, so every run is the same. ?rtc=2026-01-01T00:00:00Z (ISO 8601, the default) and ?seed=1 (the default) in the URL change them. A snapshot keeps the start date and the generator's state, and Restore puts them back. Keys typed on the virtual clock go into the guest only between two slices of the JIT or of stepping and are recorded with the instruction count; Replay (Snapshots tab) puts them in at the same counts. With the real-time clock the guest gets the browser's date and random numbers, and keys when they are typed.">?</span></p>
      <p class="note mono" id="entry_info"></p>
      <p id="end_banner" class="banner" role="status" hidden></p>
      <p class="note" id="count_info"><span id="count_text"></span> <span class="tip" tabindex="0" role="button" title="Exact for the run shown: each instruction is one call of v86's interpreter. A rep-prefixed string instruction counts once per v86 entry, and v86 runs at most a page of iterations per entry, so a long rep movs counts several times (qemu counts it once). On the virtual clock (the default) every count is the same in every run, from reset and from 1 MiB, at any stepping speed and at full JIT speed: the timer follows the instruction count, the RTC starts at a fixed date, RDRAND comes from a seeded generator, and Debian&#x27;s panic and prompt stops are exact. The clock rate changes the from-reset count, since SeaBIOS&#x27;s waits take more instructions at a faster clock. A run at full JIT speed gets its timer interrupts at the ends of its slices, so its counts differ from a stepped run&#x27;s; each of the two repeats exactly. With the real-time clock the counts change from run to run: SeaBIOS waits on wall time, a kernel that calibrates a delay loop against the timer counts differently at each speed, and typed keys go in when they arrive. See the About tab for the qemu cross-check.">?</span></p>
    </div>
  </div>
  <section class="controls" aria-label="Kernel and boot">
    <label>Kernel
      <select id="kernel"></select>
    </label>
    <label>RAM
      <select id="memory">
        <option value="2097152">2 MB</option>
        <option value="4194304">4 MB</option>
        <option value="18874368">18 MB</option>
        <option value="33554432">32 MB</option>
        <option value="67108864">64 MB</option>
        <option value="100663296">96 MB</option>
        <option value="134217728">128 MB</option>
        <option value="268435456">256 MB</option>
        <option value="536870912">512 MB</option>
      </select>
    </label>
    <label><span>From disk<span class="tip" tabindex="0" role="button" title="Load any bzImage from your disk instead of the list">?</span></span>
      <input type="file" id="file">
    </label>
    <label><span>Symbols<span class="tip" tabindex="0" role="button" title="Import symbols for the current kernel: a System.map (the text llvm-nm -n or nm -n prints: hex address, type letter, name) or an unstripped vmlinux (ELF32: .symtab and section headers are read in the browser). They replace the kernel's symbols.json everywhere (memory grid, Page symbol index, Debugger, Calls, panic detection) and the kernel reboots. A System.map has no sizes: each symbol runs to the next one, capped at the end of its section (_etext, _edata, __bss_stop, ...). Physical address = virtual - offset: auto takes PT_LOAD from an ELF, and for a System.map puts _text at 0x100000 where v86 loads the 32-bit kernel (else vaddr - 0xC0000000, the i386 PAGE_OFFSET, or identity); or type a hex offset. An unstripped vmlinux with DWARF gives file:line; for the text of the lines pick its source folder or .tar under C source. A vmlinux (offset auto) then gets the data files CI makes for the kernels in the list, made in this browser by the same generators with llvm-nm and llvm-objdump of the page's clang.wasm (fetched once, 77 MB): symbols.json, disasm.json (code up to 8 MiB), the DWARF shards with the coverage tree's file list, variables, locals, function facts and call frame information, and the C source index once its tree is picked. Until they are made, code is disassembled live and each compile unit's DWARF is read when first needed. The map and the files made are remembered in this browser for this bzImage (by SHA-256). You can also drop a bzImage and a System.map on the page together.">?</span></span>
      <input type="file" id="symfile">
    </label>
    <span id="src_pick" class="srcpick" hidden><span>C source<span class="tip" tabindex="0" role="button" title="The text of the C lines for an imported vmlinux (or a kernel without shipped source): pick the source tree it was built from, as a folder or an uncompressed .tar (ustar or GNU; a .tar.gz or .tar.xz would have to be decompressed whole in the browser, so unpack it first). The DWARF paths are relative to the tree; a folder or .tar holding it one level down (linux-6.1.176/...) works too. Only the files of the lines shown are read, when they are shown, until the files made for an imported vmlinux are there: then the files its DWARF names are read once and kept in this browser for this bzImage (gzipped, as the kernels in the list ship them). Nothing is uploaded.">?</span></span>
      <span class="row"><input type="file" id="src_tar" accept=".tar,application/x-tar" aria-label="kernel source .tar">
      <button id="src_dir_btn" type="button">folder…</button></span>
      <input type="file" id="src_dir" webkitdirectory hidden>
    </span>
    <label><span>initrd<span class="tip" tabindex="0" role="button" title="An initrd/initramfs for the kernel, passed to v86 (initrd: {buffer}). v86 0.5.471 always puts it at 64 MiB (src/kernel.js), so RAM must be larger than 64 MiB plus its size: picking one selects enough RAM. The kernel finds it through ramdisk_image/ramdisk_size in the boot header. The minified Linux does not use an external initrd yet.">?</span></span>
      <input type="file" id="initrd_file">
    </label>
    <label><span>cmdline<span class="tip" tabindex="0" role="button" title="Kernel command line, passed to v86 (cmdline). Default: nokaslr cryptomgr.notests (imported System.maps only line up without KASLR; the crypto self-tests take long when stepped), or a kernel's own default; kernels that do not know an option ignore it, and the minified Linux ignores the command line. Add e.g. console=tty0 for a distro kernel. Remembered in this browser for this bzImage (by SHA-256); ?cmdline= in the URL sets it.">?</span></span>
      <input id="cmdline" size="18" value="nokaslr cryptomgr.notests" aria-label="kernel command line">
    </label>
    <label><span>offset<span class="tip" tabindex="0" role="button" title="Physical address = virtual address - offset, for imported symbols. auto: from the ELF program headers (PT_LOAD) of a vmlinux; for a System.map _text is put at 0x100000, where v86 loads the 32-bit kernel. Or type the offset in hex (e.g. 0xc0000000, the i386 PAGE_OFFSET). Read when a symbol file is imported.">?</span></span>
      <input id="sym_offset" value="auto" size="10" aria-label="symbol offset, auto or hex">
    </label>
    <button id="boot" type="button">Boot</button>
    <span id="kinfo" class="note mono"></span>
    <span id="build_info" class="note mono"></span>
    <span id="sym_status" class="note" role="status"></span>
    <span id="gen_status" class="note" role="status"></span>
    <span id="src_status" class="note" role="status"></span>
    <span id="initrd_status" class="note"></span>
    <button id="initrd_clear" type="button" hidden>no initrd</button>
    <button id="sym_forget" type="button" hidden title="Forget the imported symbols and use the kernel's own">forget symbols</button>
  </section>
</section>

<section class="panel" id="panel_memory" role="tabpanel" aria-labelledby="tab_memory" hidden></section>

<!-- EventsPanel in events.jsx. -->
<section class="panel" id="panel_events" role="tabpanel" aria-labelledby="tab_events" hidden></section>

<!-- QuestsPanel in quests.jsx. -->
<section class="panel" id="panel_quests" role="tabpanel" aria-labelledby="tab_quests" hidden></section>

<section class="panel" id="panel_page" role="tabpanel" aria-labelledby="tab_page" hidden></section>

<section class="panel" id="panel_debugger" role="tabpanel" aria-labelledby="tab_debugger" hidden></section>

<section class="panel" id="panel_calls" role="tabpanel" aria-labelledby="tab_calls" hidden>
  <div class="scan">
    <span class="tabs"><button id="gview_timeline" type="button" aria-pressed="true">Timeline</button>
      <button id="gview_tree" type="button" aria-pressed="false">Call tree</button>
      <button id="gview_top" type="button" aria-pressed="false">Top 30</button></span>
    <label><input type="checkbox" id="graph_fold" checked> hide interrupts<span class="tip" tabindex="0" role="button" title="Hide the frames of interrupts and exceptions: everything entered through an entry stub (irq_entries_start, asm_*) and what it calls, such as the PIT's IRQ0 timer path. In the call tree they become one (interrupt and exception handling) entry.">?</span></label>
    <label id="graph_follow_l"><input type="checkbox" id="graph_follow" checked> follow</label>
    <button id="graph_fit" type="button">Fit</button>
    <button id="graph_json" type="button">JSON</button>
    <button id="graph_dot" type="button">DOT</button>
    <button id="bm_add_calls" type="button" class="bmadd" title="Bookmark the selected box's function; or right-click (long-press) a box, or point at it and press B">&#9734; Bookmark</button>
    <input id="graph_search" type="search" placeholder="search" aria-label="search the timeline or the call tree">
    <span id="graph_tl_opts" class="group">
      <button id="graph_transpose" type="button" aria-pressed="false" title="Time downwards, call depth across: better for deep stacks on wide screens">Transpose</button>
      <button id="graph_flame" type="button" aria-pressed="false" title="Root at the bottom (flame graph) instead of the top (icicle)">Flame</button>
      <label><input type="checkbox" id="graph_chains" checked> chains<span class="tip" tabindex="0" role="button" title="Draw a call whose caller has a single call and almost no own instructions in the caller's box: a \u203a b \u203a c.">?</span></label>
      <label>depth <input type="range" id="graph_depth" min="0" max="64" value="0" aria-label="maximum depth shown, 0 = all"> <span id="graph_depth_v">all</span></label>
    </span>
    <span class="tip" tabindex="0" role="button" title="Calls reconstructed from the symbol transitions the stepper records (stepping, slow motion, Run to, and the background count with ?speed=full; not at full JIT speed): a jump to the first byte of a symbol is a call, a jump into the middle of a symbol on the stack is a return to it, an entry stub starts an interrupt; a jump into the middle of a symbol not on the stack (a tail jump) replaces the top frame; a task switch suspends the calls of the task it leaves, which continue when it runs again; a thin slate-blue line marks each task switch, with the incoming task's name on top (tap it for details): comm and pid read from its task_struct with the offsets from the DWARF (the running task through current_task, the others through the task_struct current_task named when they last switched away, or the task list), else a guess (the boot task, or the task's thread function) and the tooltip says why. With more than one task the call tree has a row per task above its calls. Timeline: x = instructions from the kernel entry, y = call depth, colour = source directory (init, mm, fs, kernel, arch, lib, include), grey = interrupts; calls narrower than a pixel are merged per pixel column (tap one to zoom in); the strip on top is the whole run (drag in it to move); drag to pan, wheel or pinch to zoom; tap a box for its counts; double-click or double-tap a box (or select it and press Enter; the arrow keys move the selection) to open its function in the Page tab at its first instruction and in the Source panel at its line (Back returns here); boxes with no symbol, the merged columns and the empty area do nothing. Call tree: inclusive %, self %, calls, like perf report --children. Top 30: the symbols with the largest inclusive count, call edges between them, layered by depth; a double click opens a symbol as in the timeline. JSON has the transitions and the call tree; DOT the transitions.">?</span>
  </div>
  <p id="graph_status" class="note"></p>
  <div id="graph_crumbs" class="crumbs note" hidden></div>
  <canvas id="graph_canvas" tabindex="0" aria-label="call chart: double-click a box, or select it and press Enter, to open its function in the Page tab and the Source panel; arrow keys move the selection"></canvas>
  <div id="graph_tree" class="ctree" hidden></div>
  <div id="graph_info" class="syminfo"></div>
</section>

<section class="panel" id="panel_source" role="tabpanel" aria-labelledby="tab_source" hidden></section>

<section class="panel" id="panel_snapshots" role="tabpanel" aria-labelledby="tab_snapshots" hidden></section>

<!-- SettingsPanel in settings.jsx. -->
<section class="panel settings" id="panel_settings" role="tabpanel" aria-labelledby="tab_settings" hidden></section>

<section class="panel about" id="panel_about" role="tabpanel" aria-labelledby="tab_about" hidden></section>
</main>

<aside id="src_panel" class="srcpanel" hidden aria-label="Source"></aside>

<!-- H1: one small fixed toggle; its face shows whether the VM runs and how
     fast, its menu holds Back and Forward, the run state and Pause/Continue. -->
<div id="runbadge" class="runbadge" data-state="off">
  <div id="runbadge_menu" class="rbmenu" hidden>
    <button id="runbadge_state" type="button" class="rbwords" title="Open the Machine tab: the screen and the run controls">no machine</button>
    <div class="rbrow">
      <button id="runbadge_pause" type="button" disabled>Pause</button>
    </div>
    <div id="runbadge_pwa" class="rbpwa" hidden></div>
    <!-- K1: the bookmarks, here because the menu is reachable from every tab, next to Back and Forward. -->
    <button id="bm_open" type="button" class="bmopen" aria-expanded="false" aria-controls="bm_box">&#9733; Bookmarks <span id="bm_count"></span></button>
    <div id="bm_box" class="bmbox" hidden>
      <div class="bmtools"><button id="bm_here" type="button" title="Bookmark the machine's position: EIP and the instruction count (with a snapshot if you like)">&#9734; This position</button>
        <input id="bm_filter" type="search" placeholder="filter by name" aria-label="filter the bookmarks by name"></div>
      <ul id="bm_list" class="bmlist" aria-label="Bookmarks"></ul>
      <p id="bm_store" class="note" hidden></p>
      <div class="bmtools"><button id="bm_export" type="button" title="Save every bookmark (all kernels) as a JSON file">Export</button>
        <button id="bm_import" type="button" title="Add the bookmarks of an exported JSON file">Import</button><input id="bm_import_file" type="file" accept=".json,application/json" hidden></div>
      <p id="bm_status" class="note" role="status"></p>
    </div>
    <nav id="nav_hist" class="navhist" aria-label="Jump history">
      <button id="nav_back" type="button">&lsaquo; Back</button><button id="nav_fwd" type="button">Forward &rsaquo;</button>
    </nav>
  </div>
  <button id="runbadge_toggle" class="rbtog" type="button" data-state="off" aria-expanded="false" aria-controls="runbadge_menu" aria-label="Menu: no machine. Back, Forward, Pause" title="Menu: no machine. Back, Forward, Pause">
    <span class="rbtop" aria-hidden="true"><span class="rbbars"></span><span class="rbdot"></span><span class="rbnews" hidden></span></span>
    <span id="runbadge_speed" class="rbspeed" aria-hidden="true">off</span>
  </button>
</div>

<div id="bm_dialog" class="bmdlg" role="dialog" aria-labelledby="bm_dlg_h" hidden>
  <b id="bm_dlg_h">&#9734; Add a bookmark</b>
  <p id="bm_what" class="note"></p>
  <label class="bmname">name <input id="bm_name" type="text" autocomplete="off" spellcheck="false"></label>
  <label id="bm_snap_l" hidden><input type="checkbox" id="bm_snap"> save a snapshot too (Snapshots tab), so the bookmark can restore the machine here</label>
  <div class="bmtools"><button id="bm_save" type="button">Save</button> <button id="bm_cancel" type="button">Cancel</button></div>
</div>

<div id="tip_pop" class="tip-pop" role="tooltip" hidden></div>
<div id="jump_pop" class="jump-pop" role="dialog" aria-label="Jump paths" hidden></div>

<!-- clock.js first: v86 must see its clock (the bundle imports the same module).
     app.bundle.js is app.js with the modules it imports, the React components
     and React, built by build.mjs (npm ci && node build.mjs). -->
<script type="module" src="clock.js"></script>
<script defer src="v86/libv86.js"></script>
<script type="module" src="app.bundle.js"></script>
</body>
</html>
