<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernel in the browser</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Boot the minified Linux, a hello kernel or Debian's kernel in v86 and step through it with a debugger, its memory map, call graph and C source.">
</head>
<body>
<header class="top">
  <div class="headline">
    <h1>Kernel in the browser<span class="tip" tabindex="0" role="button" title="Boots a bzImage in v86, an x86 emulator compiled to WebAssembly (github.com/copy/v86). The kernel, RAM, files to load and Boot are in the Machine tab; see the About tab.">?</span></h1>
  </div>

  <!-- The tab bar: TabBar in tabs.jsx (shell.jsx mounts it). -->
  <div class="tabrow" id="tabrow"></div>
</header>

<!-- The empty elements that markup/static.js names get their tab's markup
     from markup/*.jsx when build.mjs writes index.html from this file. -->
<main>
<section class="panel" id="panel_machine" role="tabpanel" aria-labelledby="tab_machine"></section>

<section class="panel" id="panel_memory" role="tabpanel" aria-labelledby="tab_memory" hidden></section>

<!-- EventsPanel in events.jsx. -->
<section class="panel" id="panel_events" role="tabpanel" aria-labelledby="tab_events" hidden></section>

<!-- QuestsPanel in quests.jsx. -->
<section class="panel" id="panel_quests" role="tabpanel" aria-labelledby="tab_quests" hidden></section>

<section class="panel" id="panel_page" role="tabpanel" aria-labelledby="tab_page" hidden></section>

<section class="panel" id="panel_debugger" role="tabpanel" aria-labelledby="tab_debugger" hidden></section>

<section class="panel" id="panel_calls" role="tabpanel" aria-labelledby="tab_calls" hidden></section>

<section class="panel" id="panel_source" role="tabpanel" aria-labelledby="tab_source" hidden></section>

<section class="panel" id="panel_snapshots" role="tabpanel" aria-labelledby="tab_snapshots" hidden></section>

<!-- SettingsPanel in settings.jsx. -->
<section class="panel settings" id="panel_settings" role="tabpanel" aria-labelledby="tab_settings" hidden></section>

<section class="panel about" id="panel_about" role="tabpanel" aria-labelledby="tab_about" hidden></section>
</main>

<aside id="src_panel" class="srcpanel" hidden aria-label="Source"></aside>

<!-- H1: one small fixed toggle; its face shows whether the VM runs and how
     fast, its menu holds Back and Forward, the run state and Pause/Continue. -->
<div id="runbadge" class="runbadge" data-state="off"></div>

<div id="bm_dialog" class="bmdlg" role="dialog" aria-labelledby="bm_dlg_h" hidden>
  <b id="bm_dlg_h">&#9734; Add a bookmark</b>
  <p id="bm_what" class="note"></p>
  <label class="bmname">name <input id="bm_name" type="text" autocomplete="off" spellcheck="false"></label>
  <label id="bm_snap_l" hidden><input type="checkbox" id="bm_snap"> save a snapshot too (Snapshots tab), so the bookmark can restore the machine here</label>
  <div class="bmtools"><button id="bm_save" type="button">Save</button> <button id="bm_cancel" type="button">Cancel</button></div>
</div>

<div id="tip_pop" class="tip-pop" role="tooltip" hidden></div>
<div id="jump_pop" class="jump-pop" role="dialog" aria-label="Jump paths" hidden></div>

<!-- clock.js first: v86 must see its clock (the bundle imports the same module).
     app.bundle.js is app.js with the modules it imports, the React components
     and React, built by build.mjs (npm ci && node build.mjs). -->
<script type="module" src="clock.js"></script>
<script defer src="v86/libv86.js"></script>
<script type="module" src="app.bundle.js"></script>
</body>
</html>
